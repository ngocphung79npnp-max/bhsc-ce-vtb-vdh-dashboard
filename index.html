  }

  // ---------------- tabs ----------------
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join('');
  }
  function renderHead() {
    const me = M.me;
    $('#hTinh').textContent = me.tinhName.toUpperCase();
    $('#hSub').textContent = `Chất lượng & doanh thu · Kho CN BHSC CE ${cfg.khoTen || ''} (${me.khoBH}) · BDĐK ${me.khoBD}`;
    $('#hPeriod').textContent = `Tháng ${me.thang}/${me.nam}`;
    $('#hPeriodSub').textContent = `Doanh thu lũy kế đến ${String(M.CH).padStart(2, '0')}/${String(me.thang).padStart(2, '0')}`;
    const H = me.has;
    const items = [['bt', 'DT hãng 4260'], ['d11', '1 Đổi 1'], ['cn', 'BHMR'], ['vd', 'Vận đơn / SCDV'], ['d319', 'Data 319'], ['jc', 'Jobcard'], ['sao', 'Sao PV'], ['gy', 'Góp ý'], ['rsm', 'BC vùng 1Đ1-BHMR']];
    const nf = me.files.filter(f => f.type && f.type !== 'ticket').length;
    $('#srcbar').innerHTML = `<span>Dữ liệu: <b>${nf} file</b> · xử lý lúc ${E(new Date(R.generated).toLocaleString('vi-VN'))}</span><div class="dots">${items.map(([k, l]) => `<span class="dot ${H[k] ? 'ok' : ''}" title="${H[k] ? 'Đã có' : 'Chưa có'}"><i></i>${l}</span>`).join('')}</div>`;
    document.documentElement.style.setProperty('--hb', $('#appbar').offsetHeight + 'px');
  }

  function kpiCard(o) {
    return `<div class="kpi ${o.cls || ''}"><span class="kl">${o.l}</span><span class="kv">${o.v}</span><span class="ks">${o.s || ''}</span><div class="kf">${o.f || ''}</div></div>`;
  }
  function revTable(keys, m) {
    const rv = m.rv;
    return `<div class="tw"><table class="t"><thead><tr><th class="l">Hạng mục</th><th>Target T${m.me.thang}</th><th>Thực đạt (LK ${String(m.CH).padStart(2, '0')}/${m.me.thang})</th><th>% thực đạt</th><th>Dự kiến cuối tháng</th><th>% dự kiến</th><th>Đánh giá</th><th>Sản lượng</th><th>Tuần 1</th><th>Tuần 2</th><th>Tuần 3</th></tr></thead><tbody>${keys.map(k => {
      const r = rv[k], tot = ['bt', 'bn', 'tong'].includes(k);
      return `<tr class="${tot ? 'tot' : ''}"><td class="l">${E(r.label)}</td><td>${r.tg != null ? F.vi(r.tg) : '<span class="miss">chưa có</span>'}</td><td><b>${F.vi(r.lk)}</b></td>
        <td class="${r.pct == null ? '' : r.pct >= m.td ? 'good' : ''}">${F.pct(r.pct)}</td><td>${F.vi(r.dk)}</td><td>${F.pct(r.pdk)}</td><td class="c">${r.dg ? pill(r.dg) : '–'}</td>
        <td>${F.vi(r.sl)}</td><td>${F.vi(r.weeks[0])}</td><td>${F.vi(r.weeks[1])}</td><td>${F.vi(r.weeks[2])}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  }

  // ---------------- TỔNG QUAN ----------------
  function vTongQuan(m) {
    const dh = m.crit[1], sao = m.sao, b1 = m.bnq[0], rv = m.rv;
    const revCard = (k, title) => { const r = rv[k]; return kpiCard({ l: title, v: F.tr(r.lk), s: r.tg != null ? `Target ${F.tr(r.tg)} · đạt ${F.pct(r.pct)}` : 'Chưa có target', cls: r.dg === 'ĐẠT' ? 'good' : r.dg ? 'bad' : '', f: `<span class="pill">Dự kiến ${F.tr(r.dk)}</span>${r.dg ? pill(r.dg) : ''}` }); };
    let h = `<div class="kpis">
      ${kpiCard({ l: 'Chất lượng bên trong', v: `${m.critOk}<small>/ ${m.critN} đạt</small>`, s: `Đúng hẹn ${F.pct(dh.month, 2)} · KPI ${F.pct(dh.kpi, 1)}`, cls: m.critN ? (m.critOk === m.critN ? 'good' : 'bad') : '', f: m.crit.map(c => `<span class="pill ${c.dg === 'ĐẠT' ? 'good' : c.dg ? 'bad' : ''}">${c.key === 'pv' ? 'Phục vụ' : c.key === 'dh' ? 'Đúng hẹn' : c.key === 'tn' ? 'Tay nghề' : '5S'}</span>`).join('') })}
      ${kpiCard({ l: '1 Đổi 1 – xong trong 3 ngày', v: F.pct(b1.ty1), s: `${b1.n1}/${b1.tong} job · KPI 98% · TB vùng ${F.pct(b1.vung)}`, cls: b1.dg === 'ĐẠT' ? 'good' : b1.dg ? 'bad' : '', f: b1.dg ? pill(b1.dg) : '' })}
      ${kpiCard({ l: 'Sao phục vụ', v: sao.py != null ? F.vi(sao.py, 2) + '<small>★</small>' : '–', s: sao.has ? `KPI ${F.vi(sao.kpi, 2)} · tiếp cận ${F.pct(sao.tot.tl)}` : 'Chưa có file sao phục vụ', cls: sao.dg === 'ĐẠT' ? 'good' : sao.dg ? 'bad' : '', f: sao.dg ? pill(sao.dg) : '' })}
      ${revCard('bt', 'Doanh thu bên trong')}${revCard('bn', 'Doanh thu bên ngoài')}${revCard('tong', 'Tổng doanh thu')}
    </div>`;
    // chất lượng bên trong
    h += `<div class="card"><div class="card-h"><h2>I. Chất lượng bên trong</h2><span class="sub">Kho CN BHSC CE ${E(cfg.khoTen || '')} (${m.me.khoBH}) · TLHT = Kết quả ÷ KPI, đạt khi ≥ 100%</span></div>
      <div class="tw"><table class="t"><thead><tr><th class="l">Tiêu chí</th><th class="l">Cơ sở tính</th><th>Kết quả tháng</th><th>KPI</th><th>TLHT</th><th>Đánh giá</th><th>Tuần 1<br>(01-07)</th><th>Tuần 2<br>(08-14)</th><th>Tuần 3<br>(15-21)</th><th>Tuần 4<br>(22-${m.DIM})</th></tr></thead><tbody>
      ${m.crit.map(c => `<tr><td class="l"><b>${c.lab}</b></td><td class="l ${c.miss ? 'miss' : ''}" style="white-space:normal;min-width:200px">${E(c.coso)}</td><td><b>${fmtV(c.month, c.fmt)}</b></td><td>${fmtV(c.kpi, c.fmt === 'pct2' ? 'pct2' : c.fmt)}</td><td>${F.pct(c.tlht)}</td><td class="c">${c.dg ? pill(c.dg) : '–'}</td>${c.weeks.map((w, i) => `<td class="${c.wdg[i] === 'CHƯA ĐẠT' ? 'miss' : ''}">${fmtV(w, c.fmt)}</td>`).join('')}</tr>`).join('')}
      <tr class="tot"><td class="l" colspan="2">ĐÁNH GIÁ CHUNG</td><td colspan="4" class="c">${m.critOk} / ${m.critN} ĐẠT</td>${[0, 1, 2, 3].map(i => { const v = m.crit.filter(c => c.weeks[i] != null); return `<td class="c">${v.length ? v.filter(c => c.wdg[i] === 'ĐẠT').length + ' / ' + v.length : '–'}</td>`; }).join('')}</tr>
      </tbody></table></div></div>`;
    // bên ngoài + sao
    h += `<div class="grid g2"><div class="card"><div class="card-h"><h2>II. Chất lượng bên ngoài</h2><span class="sub">Jobcard đã hoàn tất, ngày đóng từ 01/${m.me.thang}</span></div><div class="tw"><table class="t"><thead><tr><th class="l">Loại jobcard</th><th>Mục tiêu</th><th>Đã HT</th><th>Đúng 3N/7N</th><th>Tỷ lệ</th><th>Đúng 6N/14N</th><th>Tỷ lệ</th><th>TG TB (ngày)</th><th>TB vùng</th><th>Đánh giá</th></tr></thead><tbody>
      ${m.bnq.map(b => `<tr><td class="l"><b>${b.lab}</b></td><td class="c">${b.muc}</td><td>${F.vi(b.tong)}</td><td>${F.vi(b.n1)}</td><td>${F.pct(b.ty1)}</td><td>${F.vi(b.n2)}</td><td>${F.pct(b.ty2)}</td><td>${b.tb == null ? '–' : F.vi(b.tb, 2)}</td><td>${F.pct(b.vung)}</td><td class="c">${b.dg ? pill(b.dg) : '–'}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="card"><div class="card-h"><h2>III. Sao phục vụ</h2><span class="sub">${sao.has ? `${sao.tot.n} thợ · gộp BHSC + BDĐK · ${sao.tot.loi ? 'đã trừ ' + sao.tot.loi + ' phiếu góp ý' : 'không có phiếu trừ điểm'}` : 'chưa có file sao'}</span></div>
      <div class="tw"><table class="t"><thead><tr><th class="l">Nhóm thợ</th><th>Nhân sự</th><th>Đơn BH</th><th>Notifi</th><th>ĐH đánh giá</th><th>Tiếp cận</th><th>Sao PV</th><th>Xếp loại</th></tr></thead><tbody>
      ${[['Kho ' + m.me.tinhName, sao.tot], ['Nhân viên BHSC', sao.bhsc], ['Nhân viên BDĐK', sao.bddk]].map(([l, a], i) => `<tr class="${i ? '' : 'tot'}"><td class="l">${l}</td><td>${a.n}</td><td>${F.vi(a.bh)}</td><td>${F.vi(a.notifi)}</td><td>${F.vi(a.dg)}</td><td>${F.pct(a.tl2)}</td><td>${a.spv == null ? '–' : F.vi(a.spv, 2)}</td><td class="c">${sao.has ? `<span class="xl ${XLC[a.xl2]}">${a.xl2}</span>` : '–'}</td></tr>`).join('')}
      </tbody></table></div><div class="card-b" style="display:flex;gap:6px;flex-wrap:wrap">${XL.map(([g, c]) => `<span class="xl ${c}">${g}: ${sao.cnt[g]}</span>`).join('')}</div></div></div>`;
    // doanh thu
    h += `<div class="card"><div class="card-h"><h2>IV – V. Doanh thu bên trong / bên ngoài</h2><span class="sub">Dự kiến cuối tháng = Lũy kế ÷ ${m.CH} × ${m.DIM} · tiến độ thời gian ${F.pct(m.td)}</span></div>${revTable(['ch', 'ckt', 'tv', 'bt', 'd11', 'bhmr', 'scn', 'bn', 'tong'], m)}
      ${m.tg.bt == null ? `<div class="card-b note">Chưa có target Bên Trong (nhập ở tab <b>Dữ liệu nguồn & Cấu hình</b>). Target 1Đ1 / BHMR: ${m.tgSrc.d11 || 'chưa có'} · SCDV: ${m.tgSrc.scn}.</div>` : ''}</div>`;
    // charts
    const items = ['ch', 'ckt', 'tv', 'd11', 'bhmr', 'scn'].map((k, i) => ({ l: rv[k].label.replace(' (CE_TAINHA_TUVAN)', '').replace(' (45% giá bán)', ' (45%)'), v: rv[k].lk, t: F.tr(rv[k].lk), c: i < 3 ? 'var(--s1)' : 'var(--s2)' }));
    h += `<div class="grid g2"><div class="card"><div class="card-h"><h2>Doanh thu theo ngày</h2><span class="sub">triệu đồng</span></div><div class="card-b">${line([{ n: 'Bên Trong', v: rv.bt.days, c: 'var(--s1)', area: true }, { n: 'Bên Ngoài', v: rv.bn.days, c: 'var(--s2)', area: true }], m.CH)}</div></div>
      <div class="card"><div class="card-h"><h2>Thực đạt theo hạng mục</h2><span class="sub">lũy kế đến ${String(m.CH).padStart(2, '0')}/${m.me.thang}</span></div><div class="card-b">${hbar(items, { lw: 170 })}</div></div>
      <div class="card"><div class="card-h"><h2>Sao phục vụ – số thợ theo xếp loại</h2></div><div class="card-b">${cols(XL.map(([g], i) => ({ l: g.replace('Tóp ', ''), v: sao.cnt[g], c: `var(--xl${i + 1})` })), { h: 200 })}</div></div>
      <div class="card"><div class="card-h"><h2>Chuyển hãng theo nhóm hàng</h2><span class="sub">${m.d319.ch}/${m.d319.tot} vận đơn (${F.pct(m.d319.rCh, 0)})</span></div><div class="card-b">${hbar(m.d319.groups.map(g => ({ l: `${g.replace(' (IMEI)', '')} (${Math.round(m.d319.kr[g] * 100)}%)`, v: m.d319.chG[g], c: 'var(--s4)' })), { lw: 200, rh: 22 })}</div></div></div>`;
    h += notesCard(m);
    return h;
  }
  function notesCard(m) {
    const me = m.me, L = m.bhmrLoai;
    const ps = [
      `Số liệu chốt: doanh thu lũy kế đến ${String(m.CH).padStart(2, '0')}/${String(me.thang).padStart(2, '0')}/${me.nam} (ngày nhỏ nhất mà các nguồn doanh thu cùng có data) · đúng hẹn đến ${String(m.dung.cut).padStart(2, '0')}/${me.thang} · góp ý đến ${m.gy.cut ? F.dt(m.gy.cut) : '–'}.`,
      `Bên Trong = data 4260, kho điều phối/doanh thu có mã tỉnh ${me.tinh}: Chuyển hãng 7.500đ/phiếu · Chuyển kỹ thuật đủ giá · Tư vấn TMS 4.000đ/phiếu. Đã bỏ Bảo hành tại kho, Sửa chữa có phí.`,
      me.src1d1 === 'rsm' ? `1 Đổi 1 & BHMR lấy đúng số của "${E(m.rsm && m.rsm.title || 'Báo cáo doanh thu 1Đ1 – BHMR')}" (theo kho xuất ${me.khoBH}), cắt đến ngày chốt.` :
        `1 Đổi 1 = 45% giá bán data 1994 (siêu thị mã ${me.tinh}, gồm TGDĐ, kho CN) · BHMR = data chứng nhận dịch vụ, siêu thị theo mã cửa hàng của đơn thiết bị, bỏ chứng nhận đã hủy, mỗi máy 1 gói${L.dup ? ` (đã loại ${L.dup} gói xuất lặp, ${F.tr(L.dupV)})` : ''}.`,
      `SCDV tại nhà theo skill SCDV: lọc trùng Mã vận đơn + Mã đơn hàng vật lý · Có LK = YCVC 1195 · Board = 1196/1197 · Không LK = 1126/1194 · đơn = Giao hàng thành công, doanh thu = Tổng tiền.`,
      `Đúng hẹn tạm tính: vận đơn kho ${me.khoBH}, loại YCVC BHSC, 1 mã vận đơn = 1 đơn, tuần theo lịch hẹn cuối; trễ = giao thực tế sau lịch hẹn cuối. Chưa trừ đơn đổi giờ KH không xác nhận vì chưa có file KSNB.`,
      `Sao phục vụ: tổng điểm = 5★×5 + … + 1★ · tỉ lệ tiếp cận = ĐH đánh giá ÷ notifi · 1 phiếu góp ý ĐÚNG HẸN / TAY NGHỀ / 5S của thợ = trừ 5 đánh giá 5★ (−25 điểm). Xếp loại ≥60% Vượt trội · 50–59% sắp Vượt trội · 30–49% Trung bình · 20–29% TB-Kém · <20% Luân chuyển.`,
    ];
    return `<div class="card"><div class="card-h"><h2>Ghi chú – nguồn số &amp; quy tắc</h2></div><div class="card-b note">${ps.map(p => `<p>• ${p}</p>`).join('')}</div></div>`;
  }

  // ---------------- DOANH THU ----------------
  function vDoanhThu(m) {
    const rv = m.rv, keys = ['tong', 'bt', 'bn', 'ch', 'ckt', 'tv', 'd11', 'bhmr', 'scn'];
    let h = `<div class="card"><div class="card-h"><h2>Doanh thu – ${E(m.me.tinhName)} – tháng ${m.me.thang}/${m.me.nam}</h2><span class="sub">Target · thực đạt · dự kiến cuối tháng · tuần</span></div>${revTable(keys, m)}</div>`;
    h += `<div class="card"><div class="card-h"><h2>Diễn biến theo ngày</h2><span class="sub">đồng · cột mờ = sau ngày chốt</span></div><div class="tw"><table class="t"><thead><tr><th class="l">Hạng mục</th>${Array.from({ length: m.DIM }, (_, i) => `<th>${String(i + 1).padStart(2, '0')}</th>`).join('')}</tr></thead><tbody>
      ${keys.map(k => `<tr class="${['tong', 'bt', 'bn'].includes(k) ? 'tot' : ''}"><td class="l">${E(rv[k].label)}</td>${rv[k].days.slice(0, m.DIM).map((v, i) => `<td class="${i >= m.CH ? 'heat0' : ''}">${i >= m.CH ? '' : F.vi(v)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
    h += `<div class="grid g2"><div class="card"><div class="card-h"><h2>Bên Trong theo ngày</h2></div><div class="card-b">${line([{ n: 'Chuyển hãng', v: rv.ch.days, c: 'var(--s3)' }, { n: 'Chuyển kỹ thuật', v: rv.ckt.days, c: 'var(--s1)' }, { n: 'Tư vấn', v: rv.tv.days, c: 'var(--s4)' }], m.CH)}</div></div>
      <div class="card"><div class="card-h"><h2>Bên Ngoài theo ngày</h2></div><div class="card-b">${line([{ n: '1 Đổi 1 (45%)', v: rv.d11.days, c: 'var(--s2)' }, { n: 'BHMR', v: rv.bhmr.days, c: 'var(--s1)' }, { n: 'SCDV tại nhà', v: rv.scn.days, c: 'var(--s3)' }], m.CH)}</div></div></div>`;
    return h;
  }

  // ---------------- SIÊU THỊ ----------------
  function vSieuThi(m) {
    const t = m.st.t, rows = m.st.rows;
    const flt = { all: r => true, khong: r => !r.d11_sl && !r.bh_sl && !r.off, mot: r => !!r.d11_sl !== !!r.bh_sl, it: r => r.tt_d11 === 'Bán ít' || r.tt_bh === 'Bán ít' };
    const list = rows.filter(flt[stFilter]);
    const tt = v => `<span class="pill ${v === 'Có bán' ? 'good' : v === 'Bán ít' ? 'warn' : 'bad'}">${E(v)}</span>`;
    const ao = v => `<span class="pill ${v === 'Bán đủ 2 gói' ? 'good' : /^Chỉ/.test(v) ? 'warn' : /Ngoài/.test(v) ? '' : 'bad'}">${E(v)}</span>`;
    const maxT = Math.max(...rows.map(r => r.tong), 1);
    let rank = 0;
    let h = `<div class="kpis">
      ${kpiCard({ l: 'Siêu thị ĐMX', v: t.n, s: t.other ? `+ ${t.other} điểm bán khác (TGDĐ, kho CN)` : 'đang hoạt động' })}
      ${kpiCard({ l: '1Đ1 – có bán', v: `${t.d11Ban}<small>/ ${t.n}</small>`, s: `không bán: ${t.n - t.d11Ban}`, cls: t.n - t.d11Ban ? 'warn' : 'good' })}
      ${kpiCard({ l: 'BHMR – có bán', v: `${t.bhBan}<small>/ ${t.n}</small>`, s: `không bán: ${t.n - t.bhBan}`, cls: t.n - t.bhBan ? 'warn' : 'good' })}
      ${kpiCard({ l: 'Không bán gói nào', v: t.khong2, s: 'siêu thị cần RSM xử lý', cls: t.khong2 ? 'bad' : 'good' })}
      ${kpiCard({ l: 'Doanh thu 1Đ1 (45%)', v: F.tr(m.rv.d11.lk), s: `100% giá bán ${F.tr(m.rv.d11.goc ?? t.d11_100)} · target ${F.tr(m.rv.d11.tg)}`, cls: m.rv.d11.dg === 'ĐẠT' ? 'good' : m.rv.d11.dg ? 'bad' : '', f: m.rv.d11.tg ? `<span class="pill">đạt ${F.pct(m.rv.d11.pct)}</span>` : '' })}
      ${kpiCard({ l: 'Doanh thu BHMR', v: F.tr(m.rv.bhmr.lk), s: `${F.vi(m.rv.bhmr.sl)} gói · target ${F.tr(m.rv.bhmr.tg)}`, cls: m.rv.bhmr.dg === 'ĐẠT' ? 'good' : m.rv.bhmr.dg ? 'bad' : '', f: m.rv.bhmr.tg ? `<span class="pill">đạt ${F.pct(m.rv.bhmr.pct)}</span>` : '' })}
    </div>`;
    h += `<div class="banner info">Nguồn: <b>${m.st.src === 'rsm' ? 'Báo cáo doanh thu 1Đ1 – BHMR của vùng (đúng số vùng chốt)' : 'tính từ data 1994 + chứng nhận dịch vụ'}</b>. ${Math.abs(t.chenh) >= 1000 ? `Tổng các siêu thị chênh ${F.tr(t.chenh, 2)} so với dòng kho ${m.me.khoBH}: phần siêu thị tỉnh khác xuất kho này.` : 'Tổng các siêu thị khớp dòng kho.'}</div>`;
    h += `<div class="card"><div class="card-h"><h2>Xếp hạng siêu thị</h2><span class="sub">theo tổng thực đạt (1Đ1 × 45% + BHMR) · lũy kế đến ${String(m.CH).padStart(2, '0')}/${m.me.thang}</span><span class="sp"></span>
      <div class="chips" role="group" aria-label="Lọc">${[['all', 'Tất cả'], ['khong', 'Không bán gói nào'], ['mot', 'Chỉ bán 1 gói'], ['it', 'Bán ít']].map(([k, l]) => `<button class="chip" data-stf="${k}" aria-pressed="${stFilter === k}">${l}</button>`).join('')}</div></div>

  // ---------------- BHSC CE ----------------
  function vBhsc(m) {

    let h = `<div class="kpis">${kpiCard({ l: 'Vận đơn bảo hành', v: F.vi(d.tot), s: `${d.tho.length} thợ có đơn · ${F.dm(d.from)}–${F.dmy(d.to)}` })}
      ${kpiCard({ l: 'Bảo hành xong', v: F.vi(d.bhx), s: 'gồm đổi máy + trả máy' })}

      ${d.tho.map((t, i) => `<tr><td class="c">${i + 1}</td><td class="c">${t.u}</td><td class="l"><b>${E(t.ten)}</b></td><td>${F.vi(t.tot)}</td><td>${F.vi(t.bhx)}</td><td>${F.vi(t.ch)}</td><td>${F.vi(t.ccn)}</td><td>${F.vi(t.dm)}</td><td class="${t.dg === 'ĐẠT' ? '' : 'miss'}">${F.pct(t.rBhx)}</td><td class="c">${pill(t.dg === 'ĐẠT' ? 'ĐẠT' : 'X', t.dg)}</td><td>${F.pct(t.rCh)}</td>${G.map(g => `<td style="${heat(t.gc[g] || 0)}">${t.gc[g] || ''}</td>`).join('')}<td class="l miss">${t.cb ? '⚠ ' + E(t.cb) : ''}</td></tr>`).join('')}
      </tbody></table></div><div class="card-b note">BẢO HÀNH XONG = bước xử lý "Bảo hành xong" + "Đổi máy mới" + "Đổi máy sử dụng quyền lợi 1 đổi 1" + "Trả máy". Cảnh báo: tỉ lệ chuyển hãng của thợ ở nhóm hàng ≥ TB kho + 15 điểm % và ≥ 3 đơn chuyển hãng.${d.ex ? ` Đã loại ${d.ex} vận đơn người giao ngoài danh sách.` : ''}</div></div>`;

      ${g.rows.map((x, i) => `<tr><td class="c">${i + 1}</td><td class="c">${E(x.ma)}</td><td class="c">${F.dmy(x.ngay)}</td><td class="c">${x.tuan}</td><td class="l">${E(x.cd)}</td><td class="l wr">${E(x.nd)}</td><td class="l">${E(x.tenst)}</td><td class="l">${E(x.nv)}</td><td class="c">${E(x.tinh)}</td></tr>`).join('')}</tbody></table></div></div>`;
    h += `<div class="card"><div class="card-h"><h2>Đơn trễ TMS + đơn có đổi giờ giao</h2><span class="sub">${d.list.length} đơn · hạng mục trễ trống = chỉ đổi giờ, chờ KSNB</span></div><div class="tw" style="max-height:520px;overflow:auto"><table class="t"><thead><tr><th>#</th><th>Tuần</th><th>Mã vận đơn</th><th class="l">Nhân viên giao</th><th>Lịch hẹn đầu</th><th>Lịch hẹn cuối</th><th>Giao thực tế</th><th>Đổi giờ</th><th class="l">Nội dung đổi lịch</th><th class="l">Hạng mục trễ</th></tr></thead><tbody>
      ${d.list.map((x, i) => `<tr class="${x.hm ? 'hl' : ''}"><td class="c">${i + 1}</td><td class="c">${x.tuan}</td><td class="c">${E(x.vd)}</td><td class="l">${E(x.ds)}</td><td class="c">${F.dt(x.F0)}</td><td class="c">${F.dt(x.F)}</td><td class="c">${F.dt(x.G)}</td><td class="c">${E(x.doi)}</td><td class="l">${E(x.nd)}</td><td class="l ${x.hm ? 'miss' : ''}">${E(x.hm)}</td></tr>`).join('')}</tbody></table></div></div>`;
    return h;
  }

  // ---------------- NGUỒN & CẤU HÌNH ----------------
  const NEED = [['dt4260', 'Doanh thu hãng 4260', 'Doanh thu bên trong'], ['xuatban', 'Xuất bán gói 1994 (1 đổi 1)', '1 Đổi 1 theo siêu thị'], ['chungnhan', 'Chứng nhận dịch vụ (DATA BHMR)', 'BHMR theo siêu thị'],
    ['vandon', 'Vận đơn TMS (DATA SCDV, DATA 3268)', 'SCDV, đúng hẹn, đơn bảo hành'], ['d319', 'Data 319', 'Chi tiết đơn BHSC CE'], ['jobcard', 'Jobcard hoàn tất (SCDV TK)', '1 đổi 1 / trọn đời'],
    ['sao', 'Sao phục vụ (.xls hệ thống)', 'Sao phục vụ, xếp loại'], ['gopy', 'Góp ý – khiếu nại BCDATAG', 'Tay nghề, 5S, trừ điểm'], ['rsm', 'Báo cáo doanh thu 1Đ1 – BHMR vùng (tùy chọn)', 'Số 1Đ1/BHMR + target đúng như vùng']];
  function vNguon(m) {
    const types = new Set((staged.length ? [] : m.me.files).map(f => f.type));
    let h = `<div class="card"><div class="card-h"><h2>Nạp dữ liệu tháng mới</h2><span class="sub">chạy ngay trong trình duyệt, file không gửi đi đâu</span></div><div class="card-b">
      <div class="drop" id="drop"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" style="fill:none;stroke:var(--navy-500);stroke-width:1.6"/><path d="M12 11v5M9.5 13.5 12 11l2.5 2.5" style="fill:none;stroke:var(--accent-d);stroke-width:1.8;stroke-linecap:round"/></svg>
      <h3>Thả thư mục data vào đây</h3><p>Chọn thư mục cha chứa các thư mục DATA 4260, 1994, DATA BHMR, DATA SCDV, DATA 3268, Data 319, SCDV TK, DATA SAO… hoặc thả nhiều thư mục / file cùng lúc. Trang tự nhận diện theo dòng tiêu đề.</p>
      <div class="acts"><button class="btn pri" id="bDir2">Chọn thư mục</button><button class="btn" id="bFiles2">Chọn file</button></div></div>
      ${staged.length ? `<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${staged.length} file đã chọn</b> (${F.vi(staged.reduce((s, f) => s + f.size, 0) / 1048576, 1)} MB)<button class="btn pri" id="bRun">Xử lý ${staged.length} file</button><button class="btn" id="bClear">Bỏ chọn</button></div>
        <div class="tw" style="margin-top:8px;max-height:220px;overflow:auto"><table class="t"><thead><tr><th class="l">File</th><th>Dung lượng</th></tr></thead><tbody>${staged.map(f => `<tr><td class="l">${E(f.webkitRelativePath || f._path || f.name)}</td><td>${F.vi(f.size / 1048576, 1)} MB</td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="need">${NEED.map(([k, l, u]) => `<div><span class="st" style="background:${types.has(k) ? 'var(--good-bg);color:var(--good-tx)' : 'var(--none-bg);color:var(--none-tx)'}">${types.has(k) ? 'Đã có' : 'Chưa có'}</span><span><b>${l}</b><br><span class="note">${u}</span></span></div>`).join('')}</div>
      </div></div>`;
    h += `<div class="card"><div class="card-h"><h2>Cấu hình</h2><span class="sub">lưu trên trình duyệt này · số tự tính lại khi đổi</span><span class="sp"></span><button class="btn" id="bCfgReset">Về mặc định</button></div><div class="card-b"><form class="cfg" id="cfgForm">
      <h4>Phạm vi</h4>
      <label>Mã tỉnh (3 ký tự trong tên kho)<input id="c_tinh" value="${E(cfg.tinh)}" maxlength="3"></label>
      <label>Tên tỉnh<input id="c_tinhName" value="${E(cfg.tinhName)}"></label>
      <label>Mã kho BHSC CE<input id="c_khoBH" value="${E(cfg.khoBH)}" inputmode="numeric"></label>
      <label>Tên kho BHSC CE<input id="c_khoTen" value="${E(cfg.khoTen)}"></label>
      <label>Mã kho BDĐK<input id="c_khoBD" value="${E(cfg.khoBD)}" inputmode="numeric"></label>
      <label>Ngày chốt doanh thu (0 = tự động, đang ${m.me.autoChot})<input id="c_chot" type="number" min="0" max="31" value="${cfg.chot || 0}"></label>
      <h4>Target tháng (đồng) – để trống nếu chưa có</h4>
      <label>Bên Trong (BH tại nhà)<input id="t_bt" inputmode="numeric" value="${E(cfg.tg.bt)}" placeholder="chưa có"></label>
      <label>1 Đổi 1 (thực đạt 45%)<input id="t_d11" inputmode="numeric" value="${E(cfg.tg.d11)}" placeholder="${m.tgSrc.d11 ? F.vi(m.tg.d11) + ' – ' + m.tgSrc.d11 : 'chưa có'}"></label>
      <label>Bảo hành mở rộng<input id="t_bhmr" inputmode="numeric" value="${E(cfg.tg.bhmr)}" placeholder="${m.tgSrc.bhmr ? F.vi(m.tg.bhmr) + ' – ' + m.tgSrc.bhmr : 'chưa có'}"></label>
      <label>SCDV tại nhà<input id="t_scn" inputmode="numeric" value="${E(cfg.tg.scn)}" placeholder="${F.vi(m.tg.scn)} – ${m.tgSrc.scn}"></label>
      <h4>KPI chất lượng</h4>
      <label>Sao phục vụ<input id="k_pv" type="number" step="0.01" value="${cfg.kpi.pv}"></label>
      <label>Đúng hẹn (%)<input id="k_dh" type="number" step="0.01" value="${+(cfg.kpi.dh * 100).toFixed(2)}"></label>
      <label>Tay nghề (%)<input id="k_tn" type="number" step="0.01" value="${+(cfg.kpi.tn * 100).toFixed(2)}"></label>
      <label>Thợ chuẩn 5S (điểm)<input id="k_s5" type="number" step="0.1" value="${cfg.kpi.s5}"></label>
      <label>Bảo hành xong 319 (%)<input id="k_bhx" type="number" step="1" value="${Math.round(cfg.kpi.bhx * 100)}"></label>
      </form><p class="note" style="margin:10px 0 0">Đổi mã tỉnh / kho / ngày chốt thì cần nạp lại thư mục data để xử lý lại. Target và KPI đổi là tính lại ngay.</p></div></div>`;
    const fl = m.me.files;
    h += `<div class="card"><div class="card-h"><h2>File đã xử lý</h2><span class="sub">${fl.length} file · ${E(new Date(R.generated).toLocaleString('vi-VN'))}</span><span class="sp"></span><button class="btn" id="bJson2">Lưu JSON</button><button class="btn" id="bLoadJson">Mở JSON</button></div><div class="tw" style="max-height:420px;overflow:auto"><table class="t"><thead><tr><th class="l">File</th><th class="l">Nhận diện</th><th>Số dòng</th><th>Dòng ${E(m.me.tinhName)}</th><th>Dung lượng</th></tr></thead><tbody>
      ${fl.map(f => `<tr class="${f.type && f.type !== 'ticket' ? '' : 'dim'}"><td class="l">${E(f.name)}</td><td class="l">${E(f.label)}${f.err ? ` <span class="miss">lỗi: ${E(f.err)}</span>` : ''}</td><td>${F.vi(f.rows)}</td><td>${F.vi(f.kept)}</td><td>${F.vi(f.size / 1048576, 1)} MB</td></tr>`).join('')}
      </tbody></table></div>${m.me.log.length ? `<div class="card-b note">${m.me.log.map(E).join('<br>')}</div>` : ''}</div>`;
    return h;
  }

  // ---------------- render ----------------
  function render() {
    M = buildModel(R, cfg);
    renderHead(); renderTabs();
    const V = { tongquan: vTongQuan, doanhthu: vDoanhThu, sieuthi: vSieuThi, nhanvien: vNhanVien, bhsc: vBhsc, scdv: vScdv, trehen: vTreHen, nguon: vNguon }[tab];
    let html;
    try { html = V(M); } catch (e) { console.error(e); html = `<div class="banner">Không hiển thị được tab này: ${E(e.message)}</div>`; }
    $('#main').innerHTML = `<section class="module" role="tabpanel">${html}</section>`;
    bindMain();
  }
  function bindMain() {
    const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
    on('bDir2', 'click', () => $('#fDir').click()); on('bFiles2', 'click', () => $('#fFiles').click());
    on('bRun', 'click', process); on('bClear', 'click', () => { staged = []; render(); });
    on('bJson2', 'click', saveJson); on('bLoadJson', 'click', () => $('#fFiles').click());
    on('bCfgReset', 'click', () => { cfg = JSON.parse(JSON.stringify(DEFAULT_CFG)); saveCfg(); render(); toast('Đã về cấu hình mặc định'); });
    on('q319', 'input', e => { q319 = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('q319'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } });
    document.querySelectorAll('[data-stf]').forEach(b => b.addEventListener('click', () => { stFilter = b.dataset.stf; render(); }));
    const form = document.getElementById('cfgForm');
    if (form) form.addEventListener('change', () => {
      const v = id => document.getElementById(id).value.trim();
      const n = id => v(id).replace(/[^\d.]/g, '');
      Object.assign(cfg, { tinh: v('c_tinh').toUpperCase() || 'PYE', tinhName: v('c_tinhName') || 'Phú Yên', khoBH: v('c_khoBH'), khoTen: v('c_khoTen'), khoBD: v('c_khoBD'), chot: +v('c_chot') || 0 });
      cfg.tg = { bt: n('t_bt'), d11: n('t_d11'), bhmr: n('t_bhmr'), scn: n('t_scn') };
      cfg.kpi = { pv: +v('k_pv') || 3.85, dh: (+v('k_dh') || 98.8) / 100, tn: (+v('k_tn') || 99.88) / 100, s5: +v('k_s5') || 9.9, bhx: (+v('k_bhx') || 70) / 100 };
      saveCfg();
      if (cfg.chot && cfg.chot !== R.meta.chot) toast('Ngày chốt mới áp dụng khi xử lý lại data');
      render();
    });
    const drop = document.getElementById('drop');
    if (drop) {
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', async e => { const fs = await filesFromDrop(e.dataTransfer); addFiles(fs); });
    }
  }
  function saveCfg() { LS.set('bhsc-py-cfg', JSON.stringify(cfg)); }

  // ---------------- nạp file ----------------
  async function filesFromDrop(dt) {
    const out = [];
    const items = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!items.length) return [...dt.files];
    const walk = (entry, path) => new Promise(res => {
      if (entry.isFile) entry.file(f => { f._path = path + f.name; out.push(f); res(); }, () => res());
      else if (entry.isDirectory) {
        const rd = entry.createReader(); const all = [];
        const next = () => rd.readEntries(async es => { if (!es.length) { for (const x of all) await walk(x, path + entry.name + '/'); res(); } else { all.push(...es); next(); } }, () => res());
        next();
      } else res();
    });
    for (const it of items) await walk(it, '');
    return out;
  }
  function addFiles(list) {
    const arr = [...list];
    const js = arr.find(f => /\.json$/i.test(f.name));
    if (js && arr.length === 1) { loadJson(js); return; }
    const keep = arr.filter(f => /\.(xlsx|xlsm|xls|htm|html)$/i.test(f.name) && !/^~\$/.test(f.name));
    const key = f => f.name + '|' + f.size + '|' + (f.lastModified || 0);
    const have = new Set(staged.map(key));
    for (const f of keep) if (!have.has(key(f))) staged.push(f);
    tab = 'nguon'; render();
    toast(keep.length ? `Đã thêm ${keep.length} file. Bấm "Xử lý" khi đã chọn đủ thư mục.` : 'Không có file Excel nào trong lựa chọn này');
  }
  async function process() {
    if (!staged.length) return;
    const busy = $('#busy'); busy.hidden = false;
    const t0 = Date.now();
    try {
      const res = await PIPE.run(staged, { ...cfg }, p => {
        $('#busyT').textContent = p.phase === 'Tổng hợp' ? 'Đang tổng hợp số liệu…' : `${p.phase} file ${(p.i || 0) + 1}/${p.n || 1}`;
        $('#busyF').textContent = p.file ? `${p.file}${p.label ? ' · ' + p.label : ''}` : '';
        const base = p.n ? ((p.i || 0) + (p.p || 0)) / p.n : 1;
        $('#busyP').style.width = (base * 100).toFixed(1) + '%';
      });
      R = res; staged = [];
      if (!LS.set('bhsc-py-R', JSON.stringify(R))) console.warn('Không lưu được vào trình duyệt');
      tab = 'tongquan'; render();
      toast(`Xong trong ${Math.round((Date.now() - t0) / 1000)} giây · tháng ${R.meta.thang}/${R.meta.nam}, chốt ngày ${R.meta.chot}`, 5000);
    } catch (e) { console.error(e); toast('Lỗi khi xử lý: ' + e.message, 7000); }
    busy.hidden = true;
  }
  async function loadJson(f) {
    try {
      const o = reviveDates(JSON.parse(await f.text()));
      if (!o.meta || !o.dt) throw new Error('không phải file JSON của trang này');
      R = o; if (o.cfg) cfg = { ...cfg, ...o.cfg, tg: { ...cfg.tg, ...o.cfg.tg }, kpi: { ...cfg.kpi, ...o.cfg.kpi } };
      LS.set('bhsc-py-R', JSON.stringify(R)); saveCfg(); tab = 'tongquan'; render(); toast('Đã mở số liệu từ JSON');
    } catch (e) { toast('Không mở được JSON: ' + e.message, 6000); }
  }

  // ---------------- lưu / xuất ----------------
  async function offer(filename, blob) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename, data: blob }); toast('Đã lưu ' + filename); return; }
    } catch (e) {
      if (e && e.code === 'declined') { toast('Đã hủy lưu file'); return; }
      if (e && e.code === 'rate_limited') { toast('Đang có hộp thoại lưu file khác, thử lại sau giây lát'); return; }
      if (e && e.code && e.code !== 'unavailable' && e.code !== 'not_granted') { toast('Không lưu được: ' + (e.message || e.code), 6000); return; }
    }
    if (window.claude && window.claude.use && !window.__LOCAL__) { toast('Trình xem này không cho tải file. Mở trang trong claude.ai để tải.', 6000); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  async function saveJson() {
    const o = { ...R, cfg };
    await offer(`BHSC-${R.meta.tinh}-T${R.meta.thang}.${R.meta.nam}-chot${R.meta.chot}.json`, new Blob([JSON.stringify(o)], { type: 'application/json' }));
  }
  async function exportX(kind) {
    $('#xlsMenu').hidden = true; $('#bXls').setAttribute('aria-expanded', 'false');
    try {
      const { blob, name } = kind === 'cl' ? await EXP.chatLuong(M) : await EXP.sieuThi(M);
      await offer(name, blob);
    } catch (e) { console.error(e); toast('Lỗi khi tạo file Excel: ' + e.message, 6000); }
  }
  async function exportPpt() {
    if (!R || !R.meta || !R.meta.has || !Object.values(R.meta.has).some(Boolean)) { toast('Chưa có dữ liệu – nạp thư mục data trước', 5000); return; }
    const b = $('#bPpt'); b.disabled = true; const t0 = b.textContent; b.textContent = 'Đang tạo slide…';
    try { const { blob, name } = await PPT.build(M); await offer(name, blob); }
    catch (e) { console.error(e); toast('Lỗi khi tạo PowerPoint: ' + e.message, 6000); }
    finally { b.disabled = false; b.textContent = t0; }
  }
  window.__APP__ = { exportBlob: async kind => kind === 'ppt' ? PPT.build(M) : kind === 'cl' ? EXP.chatLuong(M) : EXP.sieuThi(M), state: () => ({ R, M, cfg }) };

  // ---------------- sự kiện chung ----------------
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; try { history.replaceState(null, '', '#' + tab); } catch (_) { } render(); window.scrollTo({ top: 0 }); });
  $('#bDir').addEventListener('click', () => $('#fDir').click());
  $('#bFiles').addEventListener('click', () => $('#fFiles').click());
  $('#fDir').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#fFiles').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#bJson').addEventListener('click', saveJson);
  $('#bPpt').addEventListener('click', exportPpt);
  $('#bXls').addEventListener('click', e => { e.stopPropagation(); const p = $('#xlsMenu'); p.hidden = !p.hidden; $('#bXls').setAttribute('aria-expanded', String(!p.hidden)); });
  $('#xlsMenu').addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (b) exportX(b.dataset.x); });
  document.addEventListener('click', e => { if (!e.target.closest('.menu')) { $('#xlsMenu').hidden = true; $('#bXls').setAttribute('aria-expanded', 'false'); } });
  window.addEventListener('resize', () => document.documentElement.style.setProperty('--hb', $('#appbar').offsetHeight + 'px'));
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', async e => { if (e.target.closest('#drop')) return; e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(await filesFromDrop(e.dataTransfer)); });

  if (!R) { R = emptyR(cfg); tab = 'nguon'; }
  render();
})();

</script>
