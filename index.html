<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BHSC CE Phú Yên</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: thanh tiêu đề navy viền vàng (như dashboard vùng) → thanh kỳ báo cáo → tab → nội dung thẻ + bảng; số căn cột tabular */
:root{
  --navy-900:#081527; --navy-800:#0B1E38; --navy-700:#102C50; --navy-600:#17406F; --navy-500:#215B96; --navy-050:#EEF3FA;
  --accent:#FFD500; --accent-d:#E0BB00; --accent-ink:#0B1E38;
  --surface:#FFFFFF; --plane:#F2F5F9; --raised:#F7F9FC; --sunken:#EDF1F7;
  --ink:#0E1A2B; --ink-2:#3D4C63; --muted:#6E7D93; --hair:#E2E8F0; --hair-2:#CBD5E1;
  --good:#0CA30C; --good-bg:#E8F6E8; --good-tx:#0A7A0A;
  --warn:#F0A202; --warn-bg:#FEF4E0; --warn-tx:#8A5A00;
  --bad:#D03B3B; --bad-bg:#FBEAEA; --bad-tx:#A82C2C;
  --none-bg:#F1F4F8; --none-tx:#64748B;
  --s1:#2A78D6; --s2:#EB6834; --s3:#1BAF7A; --s4:#7A4FD0; --grid:#E7ECF3;
  --xl1:#00B050; --xl2:#92D050; --xl3:#FFC000; --xl4:#ED7D31; --xl5:#C00000; --xl6:#E4E7EE;
  --r:10px; --r-lg:14px;
  --sh-1:0 1px 2px rgba(14,26,43,.06),0 1px 3px rgba(14,26,43,.05);
  --sh-3:0 10px 30px rgba(14,26,43,.18);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#111D2E; --plane:#0A1422; --raised:#15243A; --sunken:#0E1A2A; --navy-050:#16263D;
  --ink:#E6EDF7; --ink-2:#B8C5D8; --muted:#8696AE; --hair:#22344D; --hair-2:#2E4463;
  --good-bg:#0F2E1A; --good-tx:#5FD37A; --warn-bg:#33270B; --warn-tx:#F2C25A; --bad-bg:#3A1717; --bad-tx:#F08A8A;
  --none-bg:#1A2638; --none-tx:#8EA0B8; --grid:#1E2E44; --s1:#5B9BEA; --s2:#F08A5D; --s3:#3CC795; --s4:#A483EA; --xl6:#2A3850;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#111D2E; --plane:#0A1422; --raised:#15243A; --sunken:#0E1A2A; --navy-050:#16263D;
  --ink:#E6EDF7; --ink-2:#B8C5D8; --muted:#8696AE; --hair:#22344D; --hair-2:#2E4463;
  --good-bg:#0F2E1A; --good-tx:#5FD37A; --warn-bg:#33270B; --warn-tx:#F2C25A; --bad-bg:#3A1717; --bad-tx:#F08A8A;
  --none-bg:#1A2638; --none-tx:#8EA0B8; --grid:#1E2E44; --s1:#5B9BEA; --s2:#F08A5D; --s3:#3CC795; --s4:#A483EA; --xl6:#2A3850;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{font-family:var(--font);font-size:13px;line-height:1.45;color:var(--ink);background:var(--plane);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--navy-800)}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
/* ---------- header ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:linear-gradient(180deg,var(--navy-800),var(--navy-900));color:#fff;border-bottom:3px solid var(--accent)}
.appbar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:38px;height:38px;flex:none;border-radius:8px;background:var(--navy-700);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.htxt{min-width:0;flex:1 1 280px}
.htxt h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.htxt h1 em{font-style:normal;color:var(--accent)}
.htxt p{margin:2px 0 0;font-size:11.5px;color:#A9BCD8}
.period{display:flex;flex-direction:column;align-items:flex-end;padding:5px 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r)}
.period .pl{font-size:9.5px;font-weight:800;letter-spacing:.9px;color:#8FA6C6;text-transform:uppercase}
.period .pv{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.period .ps{font-size:10.5px;color:#A9BCD8;white-space:nowrap}
.hacts{display:flex;gap:7px;flex-wrap:wrap}
.hbtn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hbtn.acc:hover{background:var(--accent-d)}
.hbtn:focus-visible,.tab:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh-3);min-width:290px;padding:6px;z-index:80}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer}
.menu-pop button:hover{background:var(--navy-050)}
.menu-pop b{display:block;font-size:12.5px}
.menu-pop small{color:var(--muted);font-size:11px}
/* ---------- status bar + tabs ---------- */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.srcbar{background:var(--surface);border-bottom:1px solid var(--hair)}
.srcbar .wrap{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:12px;color:var(--ink-2)}
.srcbar b{color:var(--ink)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--none-bg);color:var(--none-tx)}
.dot.ok{background:var(--good-bg);color:var(--good-tx)}
.dot i{width:6px;height:6px;border-radius:50%;background:currentColor}
.tabbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hb,60px));z-index:50;background:var(--surface);border-bottom:1px solid var(--hair);box-shadow:var(--sh-1)}
.tabbar .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:11px 13px 9px;font-size:12px;font-weight:750;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;letter-spacing:.2px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--navy-600);border-bottom-color:var(--accent)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:var(--accent)}}
main{padding-block:16px 40px}
.module{display:flex;flex-direction:column;gap:14px}
/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--sh-1);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--hair)}
.card-h h2{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink)}
.card-h .sub{font-size:11.5px;color:var(--muted)}
.card-h .sp{flex:1}
.card-b{padding:12px 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:12px 14px 11px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hair-2)}
.kpi.good::before{background:var(--good)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi .kl{font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--muted);text-transform:uppercase}
.kpi .kv{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .kv small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .ks{font-size:11.5px;color:var(--ink-2)}
.kpi .kf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap;background:var(--none-bg);color:var(--none-tx)}
.pill.good{background:var(--good-bg);color:var(--good-tx)} .pill.warn{background:var(--warn-bg);color:var(--warn-tx)} .pill.bad{background:var(--bad-bg);color:var(--bad-tx)}
.xl{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;white-space:nowrap}
.xl1{background:var(--xl1);color:#fff}.xl2{background:var(--xl2);color:#0B1E38}.xl3{background:var(--xl3);color:#0B1E38}.xl4{background:var(--xl4);color:#fff}.xl5{background:var(--xl5);color:#fff}.xl6{background:var(--xl6);color:var(--none-tx)}
/* ---------- tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.t th{background:var(--navy-800);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:8px 7px;text-align:center;white-space:nowrap;position:sticky;top:0}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:6px 7px;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.c{text-align:center}
table.t td.wr{white-space:normal;min-width:220px}
table.t tr:nth-child(even) td{background:var(--raised)}
table.t tr.tot td{background:var(--navy-050);font-weight:800;color:var(--ink);border-top:2px solid var(--navy-600)}
table.t tr.grp td{background:var(--sunken);font-weight:700}
table.t tr.dim td{color:var(--muted);font-style:italic}
table.t tr.hl td{background:var(--warn-bg)}
.miss{color:var(--bad-tx);font-weight:700;font-size:11px}
.bar{position:relative;display:inline-block;min-width:90px;height:16px;vertical-align:middle;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--s1);opacity:.35}
.bar span{position:relative;font-size:11px;padding:0 5px;line-height:16px}
.heat0{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--hair-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.btn{border:1px solid var(--hair-2);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy-500);color:var(--ink)}
.btn.pri{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.btn.pri:hover{background:var(--navy-600)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.note p{margin:0 0 5px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn-tx);font-size:12px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--navy-050);color:var(--ink-2);border-color:var(--hair)}
.banner b{color:inherit}
/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:10.5px;fill:var(--ink-2)}
.chart .ax{stroke:var(--grid);stroke-width:1}
.chart .lbl{font-weight:700;fill:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* ---------- upload ---------- */
.drop{border:2px dashed var(--hair-2);border-radius:var(--r-lg);padding:22px;text-align:center;background:var(--raised);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent-d);background:var(--warn-bg)}
.drop h3{margin:6px 0 4px;font-size:15px}
.drop p{margin:0 0 12px;color:var(--muted);font-size:12px}
.drop .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.need{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px;margin-top:12px}
.need div{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--hair);font-size:12px;text-align:left}
.need .st{font-weight:800;font-size:11px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px 14px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.cfg input,.cfg select{border:1px solid var(--hair-2);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.cfg h4{grid-column:1/-1;margin:6px 0 0;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
/* ---------- overlay / toast ---------- */
#busy{position:fixed;inset:0;background:rgba(8,21,39,.55);z-index:100;display:grid;place-items:center;padding:16px}
#busy .bx{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:20px 22px;width:min(460px,100%)}
#busy h3{margin:0 0 6px;font-size:15px}
#busy .bf{font-size:12px;color:var(--muted);min-height:34px;word-break:break-all}
.prog{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy-500),var(--accent));transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy-800);color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:var(--sh-3);z-index:110;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--navy-500)}
input[type=search]{border:1px solid var(--hair-2);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:12px;min-width:0;width:220px;max-width:100%}
@media (max-width:640px){.appbar{position:static}.tabbar{top:env(safe-area-inset-top,0px)}.htxt h1{font-size:15px}.period{display:none}.kpi .kv{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="appbar" id="appbar">
  <div class="appbar-in">
    <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 32 32"><path d="M8 24V14M16 24V8M24 24v-7" stroke="#FFD500" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg></div>
    <div class="htxt">
      <h1>KẾT QUẢ VẬN HÀNH BHSC CE – <em id="hTinh">PHÚ YÊN</em></h1>
      <p id="hSub">Chất lượng &amp; doanh thu · Kho CN BHSC CE Tuy Hòa (33286) · Vùng Duyên Hải</p>
    </div>
    <div class="period"><span class="pl">Kỳ báo cáo</span><span class="pv" id="hPeriod">–</span><span class="ps" id="hPeriodSub">–</span></div>
    <div class="hacts">
      <button class="hbtn" id="bDir" title="Chọn thư mục chứa data (chọn thư mục cha để lấy hết các thư mục con)">Nạp thư mục</button>
      <button class="hbtn" id="bFiles" title="Chọn từng file Excel / .xls / JSON">Nạp file</button>

      <button class="hbtn acc" id="bPpt" title="Bộ slide tổng hợp 10 trang trình giám đốc (PowerPoint, biểu đồ sửa được)">Xuất PowerPoint</button>
      <div class="menu">
        <button class="hbtn acc" id="bXls" aria-haspopup="true" aria-expanded="false">Xuất Excel ▾</button>
        <div class="menu-pop" id="xlsMenu" hidden>
          <button data-x="cl"><b>Báo cáo Chất lượng – Doanh thu</b><small>8 sheet: Tổng quan, Doanh thu, SCDV, Siêu thị, Sao phục vụ, BHSC CE, Trễ hẹn, Góp ý</small></button>
          <button data-x="st"><b>Báo cáo Doanh thu 1Đ1 – BHMR theo siêu thị</b><small>2 sheet: Tổng quan + xếp hạng siêu thị, Chi tiết theo ngày</small></button>
        </div>
      </div>
    </div>
  </div>
</header>
<input type="file" id="fDir" webkitdirectory directory multiple hidden>
<input type="file" id="fFiles" multiple accept=".xlsx,.xlsm,.xls,.htm,.html,.json" hidden>

<div class="srcbar"><div class="wrap" id="srcbar"></div></div>
<nav class="tabbar" id="tabbar" role="tablist"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"></main>
<div id="busy" hidden><div class="bx" role="status" aria-live="polite"><h3 id="busyT">Đang xử lý…</h3><div class="bf" id="busyF"></div><div class="prog"><i id="busyP"></i></div>
  <p class="note" style="margin:10px 0 0">File lớn (50–80 MB) mất khoảng 10–30 giây mỗi file. Đừng đóng trang trong lúc xử lý.</p></div></div>

            const d = mm ? new Date(Date.UTC(+mm[3], +mm[2] - 1, +mm[1])) : D(g('Ngày yêu cầu'));
            vote(d);
            A.bt.push({ kind, d: ymd(d), sl: N(g('Số lượng bill')) || 1, gb: N(g('Giá bán')), kho: kn });
            info.kept++;
          } else if (type === 'xuatban') {
            const ma = S(g('Mã kho xuất')), ten = S(g('Tên kho xuất'));
            if (ma && !names[ma]) names[ma] = ten;
            if (!S(g('Ngành hàng')).startsWith('1994') || tinhCode(ten) !== T) return;
            if (!/1 đổi 1/i.test(NFC(g('Tên sản phẩm')))) return;
            const key = [S(g('Mã phiếu xuất')), S(g('Mã sản phẩm')), S(g('IMEI_1')), S(g('Mã đơn hàng'))].join('|');
            if (A.d11Key.has(key)) return; A.d11Key.add(key);
            const sl = N(g('Số lượng')) || 1;
            const d = D(g('Ngày xuất'));
            A.d11.push({ d: ymd(d), ma, ten, sl, gb: N(g('Giá bán')) * sl });
            info.kept++;
          } else if (type === 'chungnhan') {
            const sc = S(g('Kho xuat SPC')), sn = S(g('Ten kho xuat SPC'));
            if (sc && !names[sc]) names[sc] = sn;
            const loai = NFC(g('Loại dịch vụ')).toLowerCase();
            if (!loai.startsWith('dịch vụ bảo hành mở rộng')) return;
            A.cn.push({ d: ymd(D(g('Ngày xuất hàng'))), dst: storeFromOrder(g('Mã đơn hàng thiết bị')), mdtb: S(g('Mã đơn hàng thiết bị')),
              imei: S(g('Mã IMEI thiết bị')), v: N(g('Giá trị thanh toán chứng nhận dịch vụ')), st: NFC(g('Trạng thái chứng nhận dịch vụ')),
              spc: sc, mcn: S(g('Mã chứng nhận dịch vụ')) });
            info.kept++;
          } else if (type === 'vandon') {
            const mk = S(g('Mã kho điều phối')), kdd = S(g('Tên Kho Đại Diện'));
            if (mk !== KBH && !(tinhCode(kdd) === T && /BHSC/i.test(kdd))) return;
            const vd = S(g('Mã vận đơn')), dh = S(g('Mã đơn hàng vật lý'));
            if (!vd) return;
            const key = vd + '|' + dh;
            if (A.vd.has(key)) return;
            const F = D(g('Lịch hẹn cuối')) || D(g('Ngày giao hàng'));
            A.vd.set(key, {
              vd, dh, yc: S(g('Loại YCVC')).replace(/\.0$/, ''), tyc: NFC(g('Tên YCVC')), F, F0: D(g('Lịch hẹn đầu')), G: D(g('Ngày giao hàng thực tế')),
              ngh: D(g('Ngày giao hàng')), ht: D(g('Thời gian hoàn tất giao hàng')) || D(g('Thời gian kết thúc')), tt: NFC(g('Trạng thái vận đơn')),
              gtc: N(g('Giao hàng thành công')), tien: N(g('Tổng tiền')), ds: NFC(g('Danh sách giao hàng')), doi: NFC(g('Có đổi giờ giao')),
              nd: NFC(g('Nội dung thay đổi lịch hẹn')), dp: S(g('Điều phối')) + ' - ' + NFC(g('Tên nhân viên điều phối')), kdd, mk,
              sp: NFC(g('Tên sản phẩm chính') ?? g('Tên sản phẩm'))
            });
            vote(F);
            info.kept++;
          } else if (type === 'd319') {
            if (S(g('coordinatorstoreidrq')) !== KBH) return;
            const vd = S(g('Mã vận đơn'));
            const key = vd + '|' + S(g('Mã sản phẩm')) + '|' + S(g('IMEI sản phẩm'));
            if (A.d319Key.has(key)) return; A.d319Key.add(key);
            A.d319.push({ vd, dh: S(g('Mã đơn hàng vật lý')), ds: NFC(g('Danh sách giao hàng')), nhom: NFC(g('Nhóm hàng')), sl: N(g('Số lượng')) || 1,
              buoc: NFC(g('Bước xử lý')) || '(chưa cập nhật)', tyc: NFC(g('Tên YCVC')), ngay: D(g('Ngày giao hàng')), tt: NFC(g('Trạng thái vận đơn')),
              sp: NFC(g('Tên sản phẩm')) });
            info.kept++;
          } else if (type === 'jobcard') {
            const lt = JC_T[NFC(g('Loại JC'))]; if (!lt) return;
            const ma = S(g('Mã Jobcard')); if (A.jc.has(ma)) return;
            const kho = S(g('Kho hiện tại Jobcard') ?? g('Kho hiện tại'));
            A.jc.set(ma, { ma, lt, code: jcCode(kho, T), kho, tao: D(g('Ngày tạo Jobcard')), dong: D(g('Ngày đóng Jobcard')),
              ht: D(g('Ngày hoàn tất')), sp: NFC(g('Sản phẩm') ?? g('model')), ch: !!S(g('Ngày chuyển hãng đầu')), hxl: NFC(g('Hướng xử lý')) });
            info.kept++;
          } else if (type === 'gopy') {
            const ma = S(g('Mã phiếu')); if (A.gyKey.has(ma)) return; A.gyKey.add(ma);
            A.gy.push({ ma, ngay: D(g('Ngày chốt data')), cd: NFC(g('Tên chủ đề')), ndlq: NFC(g('Nội dung liên quan phiếu')), nd: NFC(g('Nội dung KH phản ánh')),
              mast: S(g('Mã siêu thị')), tenst: NFC(g('Tên siêu thị')), nv: NFC(g('Nhân viên vi phạm')), pb: NFC(g('Phòng ban vi phạm')),
              erp: S(g('Mã ĐH ERP')), tt: NFC(g('Trạng thái phiếu')) });
            info.kept++;
          }
        }, P);
      } catch (e) { log.push(`⚠ ${f.name}: lỗi khi đọc (${e.message})`); info.err = e.message; }
    }

    function readSao(rows, fname, info) {
      const h = rows[0].map(NFC); const ix = n => h.indexOf(n);
      for (const r of rows.slice(1)) {
        const u = S(r[ix('User')]); if (!u) continue;
        info.rows++;
        A.sao.push({ file: fname, u, ten: NFC(r[ix('Tên Thợ ĐMX')]), kho: S(r[ix('Kho điều phối')]), pb: NFC(r[ix('Phòng Ban')]),
          s: ['5 sao', '4 sao', '3 sao', '2 sao', '1 sao'].map(n => N(r[ix(n)])), notifi: N(r[ix('Tổng notifi đã gửi')]), dg: N(r[ix('Tổng ĐH đánh giá thợ ĐMX')]) });
        info.kept++;
      }
    }
    async function readRsm(wb, info) {
      const R = { tq: null, kho: {}, st: [], chot: null, rate: 0.45, title: '' };
      const tq = [];
      await wb.rows('TỔNG QUAN', c => { tq.push(c); });
      R.title = S(tq[0] && tq[0][0]);
      const r3 = tq[2] || []; R.chot = N(r3[2]) || null; R.rate = N(r3[7]) || 0.45;
      for (const c of tq) if (NFC(c[1]) === cfg.tinhName) { R.tq = { kho: S(c[2]), tgD11: N(c[3]), tgBh: N(c[8]) }; break; }
      let sec4 = false, hdrSeen = 0;
      await wb.rows('CHI TIẾT', c => {
        const a = NFC(c[0]);
        if (a.startsWith('IV.')) sec4 = true;
        if (a === 'MIỀN') { hdrSeen++; return; }
        if (NFC(c[1]) !== cfg.tinhName) return;
        const goi = NFC(c[4]);
        const days = []; for (let i = 0; i < 31; i++) days.push(N(c[5 + i]));
        if (!sec4 && hdrSeen === 1 && (goi === '1 Đổi 1' || goi === 'Bảo Hành Mở Rộng')) R.kho[goi === '1 Đổi 1' ? 'd11' : 'bhmr'] = { days, don: N(c[38]) };
        else if (sec4) R.st.push({ ma: S(c[2]), ten: NFC(c[3]), goi: goi === '1 Đổi 1' ? 'd11' : 'bhmr', days, don: N(c[38]), tt: NFC(c[39]), ao: NFC(c[40]) });
      });
      info.rows = R.st.length; info.kept = R.st.length;
      if (!R.tq) log.push(`⚠ ${info.name}: không thấy dòng "${cfg.tinhName}" trong báo cáo vùng`);
      A.rsm = R;
    }

    // ================= TỔNG HỢP =================
    prog && prog({ phase: 'Tổng hợp', p: 1 });
    const votes = Object.entries(A.monthVotes).sort((a, b) => b[1] - a[1]);
    const ym = cfg.thang && cfg.nam ? cfg.nam * 100 + cfg.thang : (votes.length ? +votes[0][0] : 0);
    const Y = Math.floor(ym / 100), M = ym % 100;
    const DIM = new Date(Date.UTC(Y, M, 0)).getUTCDate();
    const inM = d => d && d[0] === Y && d[1] === M;
    const inMd = d => d && d.getUTCFullYear() === Y && d.getUTCMonth() + 1 === M;
    // ngày chốt doanh thu = ngày nhỏ nhất trong các "ngày dữ liệu có tới" của từng nguồn doanh thu
    const maxDay = arr => arr.reduce((m, x) => inM(x.d) ? Math.max(m, x.d[2]) : m, 0);
    const ends = [maxDay(A.bt), maxDay(A.d11), maxDay(A.cn)].filter(x => x > 0);
    if (A.rsm && A.rsm.chot) ends.push(A.rsm.chot);
    const autoChot = ends.length ? Math.min(...ends) : DIM;
    const CHOT = cfg.chot || autoChot;
    const daysArr = (arr, val, dayOf = x => x.d) => {
      const a = new Array(31).fill(0); let sl = 0;
      for (const x of arr) { const d = dayOf(x); if (inM(d) && d[2] <= CHOT) { a[d[2] - 1] += val(x); sl += x.sl || 1; } }
      return { days: a, sl };
    };
    const dt = {};
    for (const [kind, f] of [['ch', x => 7500 * x.sl], ['ckt', x => x.gb], ['tv', x => 4000 * x.sl]]) {
      const r = daysArr(A.bt.filter(x => x.kind === kind), f);
      dt[kind] = { days: r.days, sl: A.bt.filter(x => x.kind === kind && inM(x.d) && x.d[2] <= CHOT).reduce((s, x) => s + x.sl, 0) };
    }
    // ---- siêu thị + 1Đ1 + BHMR ----
    let st = [], src1d1 = 'raw', bhmrLoai = { dup: 0, dupV: 0, huy: 0, dupDh: {} };
    if (A.rsm && A.rsm.kho.d11) {
      src1d1 = 'rsm';
      const rate = A.rsm.rate || 0.45;
      const cut = a => a.map((v, i) => i < CHOT ? v : 0);
      dt.d11 = { days: cut(A.rsm.kho.d11.days).map(v => v * rate), goc: cut(A.rsm.kho.d11.days), sl: A.rsm.kho.d11.don };
      dt.bhmr = { days: cut(A.rsm.kho.bhmr ? A.rsm.kho.bhmr.days : new Array(31).fill(0)), sl: A.rsm.kho.bhmr ? A.rsm.kho.bhmr.don : 0 };
      const by = {};
      for (const r of A.rsm.st) {
        const s = by[r.ma] || (by[r.ma] = { ma: r.ma, ten: r.ten, ngoai: r.ao === 'Ngoài DS ST vùng', d11_days: new Array(31).fill(0), bh_days: new Array(31).fill(0),
          d11_sl: 0, bh_sl: 0, tt_d11: 'KHÔNG BÁN', tt_bh: 'KHÔNG BÁN', ao: r.ao });
        const days = cut(r.days);
        if (r.goi === 'd11') { s.d11_days = days; s.d11_sl = r.don; s.tt_d11 = r.tt; } else { s.bh_days = days; s.bh_sl = r.don; s.tt_bh = r.tt; }
        s.ao = r.ao || s.ao;
      }
      st = Object.values(by);
    } else {
      const d11 = daysArr(A.d11, x => x.gb * 0.45);
      dt.d11 = { days: d11.days, goc: daysArr(A.d11, x => x.gb).days, sl: d11.sl };
      // BHMR: bỏ chứng nhận đã huỷ, mỗi máy (đơn thiết bị + IMEI) chỉ tính 1 gói
      const cn = A.cn.filter(x => inM(x.d)).sort((a, b) => (a.d[2] - b.d[2]));
      const seen = new Set(), keep = [];
      for (const x of cn) {
        if (/^Đã hủy/.test(x.st)) { bhmrLoai.huy++; continue; }
        const st0 = x.dst || x.spc; const nm = names[st0] || names[x.spc] || '';
        if (tinhCode(nm) !== T) continue;
        const key = x.mdtb + '|' + x.imei;
        if (x.mdtb && seen.has(key)) { bhmrLoai.dup++; bhmrLoai.dupV += x.v; bhmrLoai.dupDh[x.mdtb] = (bhmrLoai.dupDh[x.mdtb] || 1) + 1; continue; }
        seen.add(key); keep.push({ ...x, ma: st0, sl: 1 });
      }
      const bh = daysArr(keep, x => x.v);
      dt.bhmr = { days: bh.days, sl: bh.sl };
      const by = {};
      const get = (ma) => by[ma] || (by[ma] = { ma, ten: names[ma] || ('Siêu thị ' + ma), d11_days: new Array(31).fill(0), bh_days: new Array(31).fill(0), d11_sl: 0, bh_sl: 0 });
      for (const [code, nm] of Object.entries(names)) if (tinhCode(nm) === T) get(code);
      for (const x of A.d11) if (inM(x.d) && x.d[2] <= CHOT) { const s = get(x.ma); s.d11_days[x.d[2] - 1] += x.gb; s.d11_sl += x.sl; }
      for (const x of keep) if (x.d[2] <= CHOT) { const s = get(x.ma); s.bh_days[x.d[2] - 1] += x.v; s.bh_sl += 1; }
      st = Object.values(by).filter(s => tinhCode(s.ten) === T);
      // tình trạng: Bán ít = dưới 50% bình quân siêu thị có bán
      for (const g of ['d11', 'bh']) {
        const sell = st.filter(s => s[g + '_sl'] > 0 && !/OFF/i.test(s.ten));
        const avg = sell.length ? sell.reduce((a, s) => a + s[g + '_days'].reduce((x, y) => x + y, 0), 0) / sell.length : 0;
        for (const s of st) { const v = s[g + '_days'].reduce((x, y) => x + y, 0); s['tt_' + g] = !s[g + '_sl'] ? 'KHÔNG BÁN' : (v < avg * 0.5 ? 'Bán ít' : 'Có bán'); }
      }
      for (const s of st) {
        s.off = /\(OFF\)/i.test(s.ten);
        s.ao = s.d11_sl && s.bh_sl ? 'Bán đủ 2 gói' : s.d11_sl ? 'Chỉ bán 1 Đổi 1' : s.bh_sl ? 'Chỉ bán BHMR' : 'Không bán gói nào';
      }
    }
    for (const s of st) {
      const p = s.ten.split('_')[0].toUpperCase();
      s.chuoi = p === 'VDH' ? 'Kho CN ĐMX' : p === 'TGD' ? 'Thế Giới Di Động' : p.startsWith('ĐM') ? 'Điện Máy Xanh' : 'Khác';
      s.d11_100 = s.d11_days.reduce((a, b) => a + b, 0); s.bh = s.bh_days.reduce((a, b) => a + b, 0);
    }

    // ---- vận đơn: SCDV + đúng hẹn + tổng đơn bảo hành ----
    const vds = [...A.vd.values()];
    const sc = vds.filter(x => tinhCode(x.kdd) === T && /BHSC CE/i.test(x.kdd) && (!x.ngh || (inMd(x.ngh) && x.ngh.getUTCDate() <= CHOT)));
    const scR = sc.map(x => ({ ...x, pl: SC_CO.has(x.yc) ? 'co' : SC_BO.has(x.yc) ? 'bo' : SC_KL.has(x.yc) ? 'kl' : 'khac', u: firstUid(x.ds) }));
    const scDaily = new Array(31).fill(0); let scDone = 0;
    for (const x of scR) if (DONE.has(x.tt) && x.ht && inMd(x.ht) && x.pl !== 'khac') { scDaily[x.ht.getUTCDate() - 1] += x.tien; scDone++; }
    const scAgg = rows => {
      const o = { co_n: 0, co_dt: 0, bo_n: 0, bo_dt: 0, kl_n: 0, kl_dt: 0, treo: 0, cg: 0 };
      for (const x of rows) {
        if (x.pl !== 'khac') { o[x.pl + '_n'] += x.gtc; o[x.pl + '_dt'] += x.tien; }
        if (!DONE.has(x.tt)) { if (x.tt === CHUA_GAN) o.cg++; else o.treo++; }
      }
      o.don = o.co_n + o.bo_n + o.kl_n; o.dt = o.co_dt + o.bo_dt + o.kl_dt; return o;
    };
    const scNv = {};
    for (const x of scR) { const k = x.u || x.ds || '(chưa gán)'; (scNv[k] = scNv[k] || []).push(x); }
    const scdv = { tong: scAgg(scR), nv: Object.entries(scNv).map(([u, rows]) => ({ u, ds: rows[0].ds, ...scAgg(rows) })), daily: scDaily.map((v, i) => i < CHOT ? v : 0) };
    dt.scn = { days: scdv.daily, sl: scDone };

    // đúng hẹn (tạm tính – chỉ trễ TMS)
    const byVd = new Map();
    for (const x of vds) {
      if (x.mk !== KBH || !YC_BHSC.has(x.yc)) continue;
      const o = byVd.get(x.vd);
      const better = !o || ((x.tt === 'Kết thúc vận đơn') > (o.tt === 'Kết thúc vận đơn')) || (!o.G && x.G);
      if (better) byVd.set(x.vd, x);
    }
    let dh = [...byVd.values()].filter(x => inMd(x.F));
    const gmax = dh.reduce((m, x) => x.G && inMd(x.G) ? Math.max(m, x.G.getUTCDate()) : m, 0);
    const cutDH = gmax || DIM;
    dh = dh.filter(x => x.F.getUTCDate() <= cutDH).map(x => ({ ...x, tre: !!(x.G && x.G > x.F), doiGio: !!x.doi && x.doi !== 'Không đổi giờ',
      tuan: (d => d <= 7 ? 1 : d <= 14 ? 2 : d <= 21 ? 3 : 4)(x.F.getUTCDate()) }));
    const dung = { cut: cutDH, thang: { tong: dh.length, tre: dh.filter(x => x.tre).length, doi: dh.filter(x => x.doiGio).length,
      doiTre: dh.filter(x => x.doi === 'Trễ hơn').length, chuaDen: dh.filter(x => !x.G).length },
      tuan: [1, 2, 3, 4].map(t => ({ tong: dh.filter(x => x.tuan === t).length, tre: dh.filter(x => x.tuan === t && x.tre).length })), per: {},
      list: dh.filter(x => x.tre || x.doiGio).sort((a, b) => a.F - b.F).map(x => ({ tuan: x.tuan, F: x.F, F0: x.F0, G: x.G, ht: x.ht, vd: x.vd, dh: x.dh, tyc: x.tyc,
        dp: x.dp, ds: x.ds, doi: x.doi, nd: x.nd, hm: x.tre ? 'Thợ ĐMX Chụp Hình Trễ TMS' : '', tt: x.tt })) };
    for (const x of dh) for (const u of uids(x.ds)) { const p = dung.per[u] || (dung.per[u] = { tong: 0, tre: 0, doi: 0 }); p.tong++; p.tre += x.tre; p.doi += x.doiGio; }
    // tổng đơn bảo hành (rule sao): kho BH, YCVC có "bảo hành", ngày giao trong tháng, tính cho thợ đứng đầu
    const bhDon = {}; let bhDonTong = 0;
    const seenVd = new Set();
    for (const x of vds) {
      if (x.mk !== KBH || !/bảo hành/i.test(x.tyc) || !inMd(x.ngh) || seenVd.has(x.vd)) continue;
      seenVd.add(x.vd); bhDonTong++;
      const u = firstUid(x.ds); if (u) bhDon[u] = (bhDon[u] || 0) + 1;
    }

    // ---- nhân sự ----
    const nameCnt = {};
    const addNm = (ds) => { for (const m of String(ds || '').matchAll(/(\d+)\s*-\s*([^,]+)/g)) { const u = m[1], n = m[2].trim(); (nameCnt[u] = nameCnt[u] || {})[n] = (nameCnt[u][n] || 0) + 1; } };
    for (const x of A.d319) addNm(x.ds);
    for (const x of vds) if (x.mk === KBH) addNm(x.ds);
    const saoBy = {};
    const prevM = M === 1 ? 12 : M - 1;
    const isPrev = fn => new RegExp(`(thang|tháng|t)[ _-]?0?${prevM}(\\D|$)`, 'i').test(fn.normalize('NFC'));
    for (const r of A.sao) {
      const per = isPrev(r.file) ? 'truoc' : 'nay';
      const o = saoBy[r.u] || (saoBy[r.u] = { u: r.u, ten: r.ten, kho: r.kho, pb: r.pb, nay: null, truoc: null });
      const t = o[per] || (o[per] = { s: [0, 0, 0, 0, 0], notifi: 0, dg: 0 });
      r.s.forEach((v, i) => t.s[i] += v); t.notifi += r.notifi; t.dg += r.dg;
      if (per === 'nay') { o.pb = o.pb || r.pb; o.kho = r.kho || o.kho; if (/Bảo Dưỡng/i.test(r.pb)) o.pbx = 'BDĐK'; else if (/Sửa Chữa/i.test(r.pb)) o.pbx = o.pbx || 'BHSC'; }
    }
    const roster = {};
    for (const u in nameCnt) {
      const best = Object.entries(nameCnt[u]).sort((a, b) => b[1] - a[1])[0][0];
      roster[u] = { u, ten: best, pb: 'BHSC' };
    }
    for (const u in saoBy) {
      const o = saoBy[u];
      if (roster[u] || o.kho === KBH || o.kho === KBD) {
        roster[u] = roster[u] || { u, ten: o.ten, pb: 'BHSC' };

    if (g.has && !g.rows.length) { sub(ws, r - 1, 1, 12, `✔ KHÔNG CÓ PHIẾU GÓP Ý / KHIẾU NẠI NÀO CỦA ${TN} TRONG THÁNG ${me.thang} → TAY NGHỀ 100% · THỢ CHUẨN 5S 10 điểm · không trừ điểm sao`, 26, { ...T.sub, fill: GREEN_L, font: { b: true, sz: 11, color: GREEN }, align: 'left', indent: 1 }); r = 6; }
    hdr(ws, r, 1, ['STT', 'MÃ PHIẾU', 'NGÀY', 'TUẦN', 'TÊN CHỦ ĐỀ', 'NỘI DUNG LIÊN QUAN', 'NỘI DUNG KH PHẢN ÁNH', 'MÃ KHO', 'TÊN KHO / SIÊU THỊ', 'NHÂN VIÊN VI PHẠM', 'PHÒNG BAN VI PHẠM', 'TÍNH VÀO'], 30);
    r++;
    if (!g.rows.length) { ws.cell(r, 1, '(không có phiếu)', { font: { i: true, sz: 9, color: GRAY } }); r++; }
    g.rows.forEach((x, i) => { row(ws, r, 1, [i + 1, x.ma, x.ngay, x.tuan, x.cd, x.ndlq, x.nd, x.mast, x.tenst, x.nv, x.pb, x.tinh], [null, '@', DT, null, 'L', 'L', 'L', null, 'L', 'L', 'L', 'DG'], { sz: 9, h: 40, wrap: true }); r++; });
    if (g.has) {
      r++; sec(ws, r, 1, 12, `THAM KHẢO – ${F.vi(g.tongM)} phiếu tháng ${me.thang} toàn quốc theo chủ đề`); r++;
      hdr(ws, r, 1, ['', 'TÊN CHỦ ĐỀ', '', '', '', 'SỐ PHIẾU'], 22); ws.merge(r, 2, r, 5); r++;
      g.chuDe.forEach(([k, v], i) => { row(ws, r, 1, ['', k, '', '', '', v], [null, 'L', null, null, null, INT], { fill: i % 2 ? ZEBRA : WHITE }); ws.merge(r, 2, r, 5); r++; });
    }
    return { blob: await wb.blob(), name: `BÁO CÁO CHẤT LƯỢNG - DOANH THU ${TN} T${me.thang}.${me.nam}.xlsx` };
  }

  function noteList(m) {
    const me = m.me, L = m.bhmrLoai;
    return [
      `Số liệu chốt: doanh thu lũy kế đến ${dd(m.CH)}/${dd(me.thang)}/${me.nam} · đúng hẹn đến ${dd(m.dung.cut)}/${dd(me.thang)} · góp ý đến ${m.gy.cut ? F.dt(m.gy.cut) : '–'} · data 319 ngày giao ${F.dm(m.d319.from)} – ${F.dmy(m.d319.to)}.`,
      `CHẤT LƯỢNG BÊN TRONG: KPI Phục vụ ${F.vi(m.cfg.kpi.pv, 2)} sao · Đúng hẹn ${F.pct(m.cfg.kpi.dh)} · Tay nghề ${F.pct(m.cfg.kpi.tn, 2)} · Thợ chuẩn 5S ${F.vi(m.cfg.kpi.s5, 1)} điểm. TLHT = Kết quả ÷ KPI, ĐẠT khi ≥ 100%. Tuần 1 = 01–07 · 2 = 08–14 · 3 = 15–21 · 4 = 22–${m.DIM}.`,
      `ĐÚNG HẸN (tạm tính): vận đơn kho ${me.khoBH}, loại YCVC BHSC, tuần theo lịch hẹn cuối; trễ = giao thực tế sau lịch hẹn cuối (chụp hình trễ TMS). Chưa trừ đơn đổi giờ KH không xác nhận vì chưa có file KSNB.`,
      `SAO PHỤC VỤ: data sao hệ thống, gộp BHSC + BDĐK theo mã User; sao = tổng điểm ÷ ĐH đánh giá; xếp loại theo tỉ lệ tiếp cận sau trừ phiếu góp ý (1 phiếu = −5 đánh giá 5★).`,
      `CHẤT LƯỢNG BÊN NGOÀI: jobcard 1 đổi 1 (Thợ ĐMX tại nhà) / bảo hành trọn đời, kho hiện tại mã ${me.tinh}, ngày đóng từ 01/${dd(me.thang)}; số ngày = ngày hoàn tất − ngày tạo; chỉ đo phần đã hoàn tất.`,
      `DOANH THU Bên Trong: data 4260 có kho điều phối/doanh thu mã ${me.tinh} – Chuyển hãng 7.500đ/phiếu, Chuyển kỹ thuật đủ giá, Tư vấn TMS 4.000đ/phiếu. Đã bỏ Bảo hành tại kho và Sửa chữa có phí.`,
      me.src1d1 === 'rsm' ? `1 Đổi 1 & BHMR: lấy đúng số trong báo cáo doanh thu 1Đ1 – BHMR của vùng (kho ${me.khoBH}), cắt đến ngày chốt; target 1Đ1 / BHMR theo báo cáo vùng.` :
        `1 Đổi 1 = 45% giá bán data 1994 (siêu thị mã ${me.tinh}); BHMR = data chứng nhận dịch vụ, siêu thị theo mã cửa hàng của đơn thiết bị, bỏ chứng nhận hủy, mỗi máy 1 gói${L && L.dup ? ` (đã loại ${L.dup} gói xuất lặp – ${F.vi(L.dupV)}đ)` : ''}.`,
      `SCDV tại nhà theo skill SCDV · target = ${m.tgSrc.scn}. CHI TIẾT ĐƠN BHSC CE: data 319, BẢO HÀNH XONG gồm Đổi máy & Trả máy, KPI ${F.pct(m.cfg.kpi.bhx, 0)}.`,
    ];
  }

  // ---------------- sheet siêu thị (dùng chung cho 2 file) ----------------
  function stSheet(ws, m, inCL) {
    const me = m.me, TN = me.tinhName.toUpperCase(), t = m.st.t, rv = m.rv, CH = m.CH;
    banner(ws, 1, 1, 12, `GÓI 1 ĐỔI 1 & BẢO HÀNH MỞ RỘNG – SIÊU THỊ CÓ BÁN / KHÔNG BÁN – ${TN} – T${me.thang}/${me.nam}`, 32);
    sub(ws, 2, 1, 12, `${m.st.src === 'rsm' ? 'Theo báo cáo doanh thu 1Đ1 – BHMR của vùng' : 'Tính từ data 1994 + chứng nhận dịch vụ'} · lũy kế đến ${dd(CH)}/${dd(me.thang)}/${me.nam} · 1 Đổi 1 thực đạt = 45% giá bán · BHMR = 100%`, 22);
    tiles(ws, 4, [['SIÊU THỊ ĐMX', t.n, INT, t.other ? `+ ${t.other} điểm bán khác` : 'đang hoạt động', NAVY, 1, 3], ['1Đ1 – CÓ BÁN', t.d11Ban, INT, `không bán: ${t.n - t.d11Ban}`, GREEN, 4, 4],
      ['BHMR – CÓ BÁN', t.bhBan, INT, `không bán: ${t.n - t.bhBan}`, '00A0E2', 5, 6], ['KHÔNG BÁN CẢ 2', t.khong2, INT, 'cần RSM xử lý', RED, 7, 8],
      ['DOANH THU 1Đ1 (45%)', rv.d11.lk, '#,##0.0,," tr"', rv.d11.tg ? `target ${F.tr(rv.d11.tg)} · ${F.pct(rv.d11.pct)}` : `100% = ${F.tr(rv.d11.goc ?? t.d11_100)}`, NAVY2, 9, 10],
      ['DOANH THU BHMR', rv.bhmr.lk, '#,##0.0,," tr"', rv.bhmr.tg ? `target ${F.tr(rv.bhmr.tg)} · ${F.pct(rv.bhmr.pct)}` : `${F.vi(rv.bhmr.sl)} gói`, GOLD_D, 11, 12]]);
    let r = 8;
    sec(ws, r, 1, 12, `I. TIẾN ĐỘ 2 GÓI (lũy kế đến ${dd(CH)}/${dd(me.thang)} · chuẩn tiến độ ${F.pct(m.td)})`);
    hdr(ws, r + 1, 1, ['GÓI', '', '', `TARGET T${me.thang}`, 'THỰC ĐẠT', '% ĐẠT', 'DỰ KIẾN\nCUỐI THÁNG', '% DỰ KIẾN', 'ĐÁNH GIÁ', 'SẢN LƯỢNG', 'TB / NGÀY', ''], 34); ws.merge(r + 1, 1, r + 1, 3);
    r += 2;
    for (const k of ['d11', 'bhmr']) {
      const x = rv[k];
      const dg = x.tg ? (x.pct >= m.td ? 'ĐẠT' : x.pct >= 0.9 * m.td ? 'SÁT TIẾN ĐỘ' : 'KHÔNG ĐẠT') : '';
      row(ws, r, 1, [x.label, '', '', x.tg, x.lk, x.pct, x.dk, x.pdk, dg, x.sl, x.lk / CH, ''], ['L', null, null, VND, VND, P1, VND, P1, 'DG', INT, VND, null], { b: true, color: NAVY, h: 24 });
      if (dg === 'SÁT TIẾN ĐỘ') ws.cell(r, 9, dg, st({ fill: AMBER_L, font: { b: true, color: 'C55A11' } }));
      ws.merge(r, 1, r, 3); r++;
    }
    r++;
    sec(ws, r, 1, 12, 'II. TỔNG HỢP SIÊU THỊ BÁN / KHÔNG BÁN THEO CHUỖI (điểm bán đang hoạt động)');
    hdr(ws, r + 1, 1, ['CHUỖI', '', '', 'SỐ ĐIỂM\nBÁN', '1Đ1 – CÓ\nBÁN', '1Đ1 – KHÔNG\nBÁN', '1Đ1 %\nKHÔNG BÁN', 'BHMR – CÓ\nBÁN', 'BHMR – KHÔNG\nBÁN', 'BHMR %\nKHÔNG BÁN', 'KHÔNG BÁN\nCẢ 2', 'BÁN ĐỦ\n2 GÓI'], 38); ws.merge(r + 1, 1, r + 1, 3);
    r += 2;
    const act = m.st.rows.filter(s => !s.off && !s.ngoai);
    const chs = [...new Set(act.map(s => s.chuoi))];
    const tot = [0, 0, 0, 0, 0, 0, 0];
    for (const c of chs) {
      const gs = act.filter(s => s.chuoi === c); const a = gs.filter(s => s.d11_sl).length, b = gs.filter(s => s.bh_sl).length, z = gs.filter(s => !s.d11_sl && !s.bh_sl).length, du = gs.filter(s => s.d11_sl && s.bh_sl).length;
      row(ws, r, 1, [c, '', '', gs.length, a, gs.length - a, gs.length ? (gs.length - a) / gs.length : null, b, gs.length - b, gs.length ? (gs.length - b) / gs.length : null, z, du], ['L', null, null, INT, INT, INT, P1, INT, INT, P1, INT, INT]);
      ws.merge(r, 1, r, 3); [gs.length, a, gs.length - a, b, gs.length - b, z, du].forEach((v, i) => tot[i] += v); r++;
    }
    row(ws, r, 1, [`TỔNG ${TN}`, '', '', tot[0], tot[1], tot[2], tot[0] ? tot[2] / tot[0] : null, tot[3], tot[4], tot[0] ? tot[4] / tot[0] : null, tot[5], tot[6]], ['L', null, null, INT, INT, INT, P1, INT, INT, P1, INT, INT], { fill: GOLD, b: true, color: NAVY });
    ws.merge(r, 1, r, 3);
    r += 2;
    sec(ws, r, 1, 12, `III. XẾP HẠNG SIÊU THỊ ${TN} (xếp theo tổng thực đạt = 1Đ1 × 45% + BHMR)`);
    hdr(ws, r + 1, 1, ['HẠNG', 'MÃ ST', 'TÊN SIÊU THỊ', 'CHUỖI', '1Đ1\n(đơn)', '1Đ1 DT\n100%', '1Đ1 THỰC\nĐẠT 45%', 'BHMR\n(đơn)', 'BHMR DT', 'TỔNG\nTHỰC ĐẠT', 'TỶ TRỌNG', 'BÁN GÓI NÀO'], 38);
    r += 2;
    let rk = 0;
    for (const s of m.st.rows) {
      const lab = s.off ? 'Đã OFF' : s.ao;
      row(ws, r, 1, [s.off || s.ngoai ? '–' : ++rk, isNaN(+s.ma) ? s.ma : +s.ma, s.ten, s.chuoi, s.d11_sl, s.d11_100, s.d11_45, s.bh_sl, s.bh, s.tong, t.tong ? s.tong / t.tong : null, lab],
        [null, '0', 'L', 'L', INT, VND, VND, INT, VND, VND, P1, null], { fill: r % 2 ? WHITE : ZEBRA, color: s.off || s.ngoai ? '8A94A6' : undefined, h: s.ten.length > 42 ? 26 : 18, wrap: true });
      const col = lab === 'Bán đủ 2 gói' ? [GREEN_L, GREEN] : /^Chỉ/.test(lab) ? [AMBER_L, 'C55A11'] : /Không bán/.test(lab) ? [RED_L, RED] : null;
      if (col) ws.cell(r, 12, lab, st({ fill: col[0], font: { b: true, sz: 9, color: col[1] } }));
      r++;
    }
    row(ws, r, 1, ['', '', `TỔNG ${TN} (${m.st.rows.length} điểm bán)`, '', t.d11_sl, t.d11_100, t.d11_45, t.bh_sl, t.bh, t.tong, 1, Math.abs(t.chenh) >= 1000 ? `chênh ${F.tr(t.chenh, 2)} với dòng kho` : 'khớp dòng kho'],
      [null, null, 'L', null, INT, VND, VND, INT, VND, VND, P1, null], { fill: GOLD, b: true, color: NAVY, h: 24 });
    r += 2;
    return notesRows(ws, r, 12, [`"Bán ít" = dưới 50% bình quân siêu thị có bán cùng tỉnh. Điểm bán OFF hoặc ngoài danh sách siêu thị vùng không xếp hạng, không tính độ phủ.`,
      Math.abs(t.chenh) >= 1000 ? `Tổng các siêu thị chênh ${F.vi(t.chenh)}đ so với doanh thu kho ${me.khoBH}: phần siêu thị tỉnh khác xuất kho này.` : 'Tổng các siêu thị khớp doanh thu kho.']);
  }

  // ====================================================================
  async function sieuThi(m) {
    const wb = XW.book(); const me = m.me; const TN = me.tinhName.toUpperCase(); const CH = m.CH;
    let ws = wb.sheet('TỔNG QUAN', { cols: [2, 6, 9, 38, 16, 14, 13, 13, 11, 13, 15, 12, 18, 2], freeze: 'A5', tab: GOLD_D });
    stSheet(ws, m, false);
    // ---- CHI TIẾT ----
    ws = wb.sheet('CHI TIẾT', { cols: [10, 18, 8, 38, 18, ...Array(31).fill(10.5), 14, 13, 8, 12, 16, 26], freeze: 'F3', tab: NAVY });
    const L = 41;
    banner(ws, 0, 0, L, `CHI TIẾT DOANH THU 1 ĐỔI 1 & BẢO HÀNH MỞ RỘNG – ${TN} – T${me.thang}/${me.nam} – lũy kế 01 → ${dd(CH)}/${dd(me.thang)}/${me.nam}`, 30);
    sub(ws, 1, 0, L, 'Số theo ngày tính 100% giá bán (chưa VAT). Cột THỰC ĐẠT: 1 Đổi 1 × 45%, BHMR × 100%. Phần I theo kho xuất BHSC CE; phần II–III theo từng siêu thị.', 22, T.note);
    const H5 = ['MIỀN', 'TỈNH', 'MÃ', 'KHO / SIÊU THỊ', 'GÓI', ...Array.from({ length: 31 }, (_, i) => String(i + 1)), 'LŨY KẾ\n(100% giá bán)', 'THỰC ĐẠT\n(1Đ1 = 45%)', 'SỐ ĐƠN', 'TÌNH TRẠNG', 'BÁN GÓI NÀO', 'RSM / TN PHẢN HỒI'];
    const D31 = Array(31).fill(VND);
    let r = 3;
    sec(ws, r, 0, L, `I. DOANH THU THEO NGÀY – ${TN} (kho ${me.khoBH}, 100% giá bán)`); hdr(ws, r + 1, 0, H5, 34); r += 2;
    const d11g = m.rv.d11.days.map(v => v / 0.45);
    const kho = [['1 Đổi 1', d11g, m.rv.d11.lk, m.rv.d11.sl], ['Bảo Hành Mở Rộng', m.rv.bhmr.days, m.rv.bhmr.lk, m.rv.bhmr.sl]];
    for (const [goi, days, td, sl] of kho) { row(ws, r, 0, ['Duyên Hải', me.tinhName, +me.khoBH, `Kho CN BHSC CE ${m.cfg.khoTen || ''} (${me.khoBH})`, goi, ...days.map((v, i) => i < CH ? v : null), days.reduce((a, b) => a + b, 0), td, sl, '', '', ''], ['L', 'L', '0', 'L', 'L', ...D31, VND, VND, INT, null, null, null]); r++; }
    row(ws, r, 0, ['TỔNG 2 GÓI', '', '', '', '', ...kho[0][1].map((v, i) => i < CH ? v + kho[1][1][i] : null), kho[0][1].reduce((a, b) => a + b, 0) + kho[1][1].reduce((a, b) => a + b, 0), kho[0][2] + kho[1][2], kho[0][3] + kho[1][3], '', '', ''],
      [null, null, null, null, null, ...D31, VND, VND, INT, null, null, null], { fill: GOLD, b: true, color: NAVY });
    r += 2;
    const khong = m.st.rows.filter(s => !s.off && !s.ngoai && (!s.d11_sl || !s.bh_sl));
    sec(ws, r, 0, L, `II. DANH SÁCH SIÊU THỊ ${TN} KHÔNG BÁN 1 ĐỔI 1 / BẢO HÀNH MỞ RỘNG – GỬI SIÊU THỊ / RSM · ${khong.length} ST`);
    hdr(ws, r + 1, 0, ['MIỀN', 'TỈNH', 'MÃ ST', 'TÊN SIÊU THỊ', 'KẾT LUẬN', '1Đ1 – LŨY KẾ', '', 'BHMR – LŨY KẾ', '', '1 ĐỔI 1', '', 'BHMR', '', 'RSM PHẢN HỒI / CAM KẾT'], 30);
    for (const [a, b] of [[5, 6], [7, 8], [9, 10], [11, 12]]) ws.merge(r + 1, a, r + 1, b);
    ws.merge(r + 1, 13, r + 1, 21);
    r += 2;
    for (const s of khong) {
      const kl = !s.d11_sl && !s.bh_sl ? 'Không bán cả 2' : !s.d11_sl ? 'Không bán 1 Đổi 1' : 'Không bán BHMR';
      row(ws, r, 0, ['Duyên Hải', me.tinhName, isNaN(+s.ma) ? s.ma : +s.ma, s.ten, kl, s.d11_100, '', s.bh, '', s.d11_sl ? '✓ Có bán' : '✗ Không bán', '', s.bh_sl ? '✓ Có bán' : '✗ Không bán', '', ''], ['L', 'L', '0', 'L', null, VND, null, VND, null, null, null, null, null, 'L'],
        { fill: kl === 'Không bán cả 2' ? RED_L : WHITE });
      for (const [a, b] of [[5, 6], [7, 8], [9, 10], [11, 12]]) ws.merge(r, a, r, b);
      ws.merge(r, 13, r, 21);
      r++;
    }
    r++;
    sec(ws, r, 0, L, `III. CHI TIẾT TỪNG SIÊU THỊ ${TN} – 1 ĐỔI 1 & BẢO HÀNH MỞ RỘNG (100% giá bán, gồm cả siêu thị không bán)`);
    hdr(ws, r + 1, 0, H5, 34); r += 2;
    const r1 = r;
    for (const [goi, k] of [['1 Đổi 1', 'd11'], ['Bảo Hành Mở Rộng', 'bh']]) {
      for (const s of m.st.rows) {
        const days = s[k + '_days']; const lk = days.reduce((a, b) => a + b, 0);
        const ttv = s['tt_' + k];
        row(ws, r, 0, ['Duyên Hải', me.tinhName, isNaN(+s.ma) ? s.ma : +s.ma, s.ten, goi, ...days.map((v, i) => i < CH ? v : null), lk, k === 'd11' ? lk * 0.45 : lk, s[k + '_sl'], ttv, s.off ? 'Đã OFF' : s.ao, ''],
          ['L', 'L', '0', 'L', 'L', ...D31, VND, VND, INT, null, null, 'L'], { fill: r % 2 ? WHITE : ZEBRA, sz: 9 });
        const c = ttv === 'Có bán' ? [GREEN_L, GREEN] : ttv === 'Bán ít' ? [AMBER_L, 'C55A11'] : [RED_L, RED];
        ws.cell(r, 39, ttv, st({ fill: c[0], font: { b: true, sz: 9, color: c[1] } }));
        r++;
      }
    }
    const tl = m.st.t;
    row(ws, r, 0, [`TỔNG CHI TIẾT SIÊU THỊ ${TN}`, '', '', '', '', ...Array.from({ length: 31 }, (_, i) => i < CH ? m.st.rows.reduce((a, s) => a + s.d11_days[i] + s.bh_days[i], 0) : null), tl.d11_100 + tl.bh, tl.tong, tl.d11_sl + tl.bh_sl,
      Math.abs(tl.chenh) >= 1000 ? `chênh ${F.tr(tl.chenh, 2)} với phần I` : '✔ khớp phần I', '', ''], [null, null, null, null, null, ...D31, VND, VND, INT, null, null, null], { fill: GOLD, b: true, color: NAVY, h: 22 });
    ws.filter = `A${r1}:${XW.colL(L)}${r}`;
    return { blob: await wb.blob(), name: `BÁO CÁO DOANH THU 1Đ1 - BHMR ${TN} T${me.thang}.${me.nam} - đến ${dd(CH)}.${dd(me.thang)}.xlsx` };
  }
  return { chatLuong, sieuThi };
})();
if (typeof module !== 'undefined') module.exports = EXP;

/* ======================================================================
   PPT – bộ slide tổng hợp trình giám đốc (PowerPoint 16:9, biểu đồ gốc
   của PowerPoint nên sửa được). Thư viện PptxGenJS tải khi bấm nút.
   ====================================================================== */
const PPT = (() => {
  const LIB = 'https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js';
  const C = { navy: '0B1E38', navy2: '17406F', blue: '215B96', yel: 'FFD500', ink: '0E1A2B', ink2: '3D4C63', mut: '6E7D93', hair: 'D5DDE8', plane: 'F2F5F9',
    good: '0A7A0A', goodBg: 'E8F6E8', bad: 'A82C2C', badBg: 'FBEAEA', warn: '8A5A00', warnBg: 'FEF4E0', s1: '2A78D6', s2: 'EB6834', s3: '1BAF7A', s4: '7A4FD0' };
  const FONT = 'Arial';
  let loading = null;
  function load() {
    if (window.PptxGenJS) return Promise.resolve();
    if (loading) return loading;
    loading = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = LIB; s.async = true;
      s.onload = () => window.PptxGenJS ? res() : rej(new Error('không tải được thư viện PowerPoint'));
      s.onerror = () => { loading = null; rej(new Error('không tải được thư viện PowerPoint (kiểm tra mạng)')); };
      document.head.appendChild(s);
    });
    return loading;
  }
  const tr = (n, d = 1) => F.tr(n, d);
  const pct = (n, d = 1) => F.pct(n, d);
  const stCol = v => v === 'ĐẠT' ? [C.good, C.goodBg] : v ? [C.bad, C.badBg] : [C.mut, C.plane];

  /** Các nhận định tự sinh: điểm tốt, vấn đề, hành động. */
  function insights(m) {
    const good = [], bad = [], act = [];
    const me = m.me, rv = m.rv, b1 = m.bnq[0], d = m.d319, s = m.scdv, st = m.st.t, sao = m.sao;
    for (const c of m.crit) {
      const v = c.fmt === 'pct2' ? pct(c.month, 2) : F.vi(c.month, 2);
      if (c.dg === 'ĐẠT') good.push(`${c.lab.replace(' (tạm tính)', '')}: ${v} – vượt KPI ${c.fmt === 'pct2' ? pct(c.kpi, 2) : F.vi(c.kpi, 2)}`);
      else if (c.dg) { bad.push(`${c.lab}: ${v}, chưa đạt KPI ${c.fmt === 'pct2' ? pct(c.kpi, 2) : F.vi(c.kpi, 2)}`); }
    }
    if (b1.tong) {
      if (b1.dg === 'ĐẠT') good.push(`1 Đổi 1 xong trong 3 ngày ${pct(b1.ty1)} (${b1.n1}/${b1.tong} job)`);
      else {
        const late = (b1.list || []).filter(x => x.ngay > 3).sort((a, b) => b.ngay - a.ngay);
        bad.push(`1 Đổi 1 xong trong 3 ngày chỉ đạt ${pct(b1.ty1)} (${b1.n1}/${b1.tong} job, KPI 98%, TB vùng ${pct(b1.vung)}) – ${late.length} job quá 3 ngày, TG TB ${F.vi(b1.tb, 1)} ngày`);
        act.push(`1 Đổi 1: rà ${late.length} job quá hạn (${late.slice(0, 3).map(x => x.ma).join(', ')}${late.length > 3 ? '…' : ''}); chốt đổi máy trong ngày với job đã đủ điều kiện, báo cáo tiến độ job tồn hằng ngày.`);
      }
    }
    if (d.tot) {
      const duoi = d.tho.filter(t => t.dg !== 'ĐẠT' && t.tot >= 10).sort((a, b) => a.rBhx - b.rBhx);
      if (d.dg === 'ĐẠT') good.push(`Tỉ lệ bảo hành xong ${pct(d.rBhx)} (KPI ${pct(m.cfg.kpi.bhx, 0)})`);
      else {
        bad.push(`Tỉ lệ bảo hành xong ${pct(d.rBhx)} < KPI ${pct(m.cfg.kpi.bhx, 0)}; chuyển hãng ${pct(d.rCh)} (${d.ch}/${d.tot} vận đơn), cao nhất nhóm ${d.groups.slice(0, 2).map(g => `${g.replace(' (IMEI)', '')} ${d.chG[g]} đơn`).join(', ')}`);
        const yeu = d.tho.filter(t => t.cb);
        act.push(`Bảo hành xong: kèm cặp ${duoi.slice(0, 3).map(t => `${t.ten} (${pct(t.rBhx, 0)})`).join(', ')}${yeu.length ? `; đào tạo lại môn yếu: ${yeu.slice(0, 3).map(t => `${t.ten} – ${t.cb.split(' · ')[0]}`).join('; ')}` : ''}.`);
      }
    }
    if (sao.has) {
      const tb = sao.rows.filter(r => /Trung Bình|Luân Chuyển/.test(r.xl2));
      if (tb.length) act.push(`Sao phục vụ: nâng tỉ lệ tiếp cận cho ${tb.map(r => `${r.ten} (${pct(r.tl2, 0)})`).join(', ')} – nhắc khách đánh giá ngay khi hoàn tất.`);
    }
    if (s.tg) {
      const pdk = s.dk / s.tg;
      if (pdk >= 1) good.push(`SCDV tại nhà dự kiến đạt ${pct(pdk)} target`);
      else {
        bad.push(`SCDV tại nhà dự kiến chỉ đạt ${pct(pdk)} target (${tr(s.dk)} / ${tr(s.tg)}); ${pct(s.klr)} đơn không thay linh kiện`);
        act.push(`SCDV: còn thiếu ${tr(Math.max(0, s.tg - s.dt))} đến target – tăng tư vấn thay linh kiện / sửa board, xử lý ${s.treo} đơn treo.`);
      }
    }
    for (const k of ['d11', 'bhmr']) {
      const r = rv[k];
      if (r.tg) (r.dg === 'ĐẠT' ? good : bad).push(`${r.label}: dự kiến ${pct(r.pdk)} target (${tr(r.dk)} / ${tr(r.tg)})`);
    }
    const noBh = m.st.rows.filter(x => !x.off && !x.ngoai && x.d11_sl && !x.bh_sl && x.chuoi === 'Điện Máy Xanh');
    const no2 = m.st.rows.filter(x => !x.off && !x.ngoai && !x.d11_sl && !x.bh_sl && (m.st.src === 'rsm' || x.chuoi === 'Điện Máy Xanh'));
    if (no2.length) bad.push(`${no2.length} siêu thị chưa bán gói nào: ${no2.map(x => x.ten.split(' - ').slice(1).join(' - ') || x.ten).join(', ')}`);
    if (noBh.length) act.push(`BHMR: ${noBh.length} siêu thị ĐMX chưa bán (${noBh.slice(0, 6).map(x => x.ten.split(' - ').slice(1).join(' - ')).join(', ')}${noBh.length > 6 ? '…' : ''}) – phối hợp RSM đặt chỉ tiêu và hướng dẫn tư vấn.`);
    if (m.dung.thang.doi) act.push(`Đúng hẹn: bổ sung file KSNB để chốt số chính thức (${m.dung.thang.doi} đơn có đổi giờ, ${m.dung.thang.doiTre} đơn đổi trễ hơn cần xác minh khách đồng ý).`);
    if (m.tg.bt == null) act.push('Doanh thu: cập nhật target tỉnh Bên Trong để đánh giá tiến độ doanh thu đầy đủ.');
    return { good, bad, act };
  }

  async function build(m) {
    await load();
    const pptx = new window.PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE';   // 13.333 × 7.5 in
    pptx.author = 'BHSC CE ' + m.me.tinhName; pptx.title = `Kết quả vận hành BHSC CE ${m.me.tinhName} T${m.me.thang}/${m.me.nam}`;
    const me = m.me, TN = me.tinhName, KY = `Tháng ${me.thang}/${me.nam}`, LK = `lũy kế đến ${String(m.CH).padStart(2, '0')}/${String(me.thang).padStart(2, '0')}`;
    const W = 13.333;
    let page = 0;
    const ins = insights(m);
    const T = (o = {}) => ({ fontFace: FONT, color: C.ink, margin: 0, ...o });

    function frame(title, sub) {
      const s = pptx.addSlide(); page++;
      s.background = { color: 'FFFFFF' };
      s.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: W, h: 0.9, fill: { color: C.navy }, line: { color: C.navy } });
      s.addShape(pptx.ShapeType.rect, { x: 0, y: 0.9, w: W, h: 0.06, fill: { color: C.yel }, line: { color: C.yel } });
      s.addText(title, T({ x: 0.45, y: 0.12, w: 9.6, h: 0.45, fontSize: 22, bold: true, color: 'FFFFFF' }));
      if (sub) s.addText(sub, T({ x: 0.45, y: 0.55, w: 9.6, h: 0.28, fontSize: 11.5, color: 'A9BCD8' }));
      s.addText(`${KY}\n${LK}`, T({ x: 10.3, y: 0.16, w: 2.6, h: 0.6, fontSize: 11, color: C.yel, bold: true, align: 'right' }));
      s.addText(`BHSC CE ${TN} · Kho ${me.khoBH} · ${KY}`, T({ x: 0.45, y: 7.08, w: 8, h: 0.25, fontSize: 9, color: C.mut }));
      s.addText(String(page), T({ x: 12.3, y: 7.08, w: 0.6, h: 0.25, fontSize: 9, color: C.mut, align: 'right' }));
      return s;
    }
    function tile(s, x, y, w, h, label, value, sub, status) {
      const [fc, bg] = stCol(status);
      s.addShape(pptx.ShapeType.rect, { x, y, w, h, fill: { color: 'FFFFFF' }, line: { color: C.hair, width: 1 } });
      s.addShape(pptx.ShapeType.rect, { x, y, w: 0.07, h, fill: { color: status ? fc : C.hair }, line: { color: status ? fc : C.hair } });
      s.addText(label.toUpperCase(), T({ x: x + 0.2, y: y + 0.12, w: w - (status ? 1.5 : 0.3), fit: 'shrink', h: 0.3, fontSize: 9.5, bold: true, color: C.mut, charSpacing: 0.5 }));
      s.addText(value, T({ x: x + 0.2, y: y + 0.42, w: w - 0.3, h: 0.6, fontSize: 26, bold: true, color: C.ink }));
      s.addText(sub || '', T({ x: x + 0.2, y: y + 1.02, w: w - 0.3, h: 0.45, fontSize: 10, color: C.ink2, valign: 'top' }));
      if (status) {
        s.addShape(pptx.ShapeType.roundRect, { x: x + w - 1.25, y: y + 0.12, w: 1.05, h: 0.28, fill: { color: bg }, line: { color: bg }, rectRadius: 0.14 });
        s.addText(status, T({ x: x + w - 1.25, y: y + 0.12, w: 1.05, h: 0.28, fontSize: 9, bold: true, color: fc, align: 'center', valign: 'middle' }));
      }
    }
    const H = (t, o = {}) => ({ text: t, options: { bold: true, color: 'FFFFFF', fill: { color: C.navy2 }, align: 'center', valign: 'middle', fontSize: 10, fontFace: FONT, ...o } });
    const Cc = (t, o = {}) => ({ text: t == null ? '–' : String(t), options: { fontSize: 10.5, fontFace: FONT, color: C.ink, align: 'center', valign: 'middle', ...o } });
    const dgCell = v => { const [fc, bg] = stCol(v); return Cc(v || '–', { bold: true, color: fc, fill: { color: bg } }); };
    const tbl = (s, rows, o) => s.addTable(rows, { x: 0.45, w: W - 0.9, border: { type: 'solid', pt: 0.5, color: C.hair }, rowH: 0.36, autoPage: false, ...o });

    // ---------------- 1. bìa ----------------
    {
      const s = pptx.addSlide(); page++;
      s.background = { color: C.navy };
      s.addShape(pptx.ShapeType.rect, { x: 0, y: 5.05, w: W, h: 0.08, fill: { color: C.yel }, line: { color: C.yel } });
      s.addText('BÁO CÁO TRÌNH GIÁM ĐỐC', T({ x: 0.8, y: 1.3, w: 11, h: 0.4, fontSize: 14, bold: true, color: C.yel, charSpacing: 2 }));
      s.addText(`KẾT QUẢ VẬN HÀNH BHSC CE\n${TN.toUpperCase()}`, T({ x: 0.8, y: 1.8, w: 11.5, h: 1.9, fontSize: 40, bold: true, color: 'FFFFFF', lineSpacingMultiple: 1.05 }));
      s.addText(`Chất lượng & doanh thu · ${KY} · ${LK}`, T({ x: 0.8, y: 3.8, w: 11, h: 0.45, fontSize: 18, color: 'A9BCD8' }));
      s.addText(`Kho CN BHSC CE ${m.cfg.khoTen || ''} (${me.khoBH}) · BDĐK ${me.khoBD}`, T({ x: 0.8, y: 5.4, w: 11, h: 0.35, fontSize: 13, color: 'FFFFFF' }));
      s.addText(`Chất lượng bên trong ${m.critOk}/${m.critN} đạt · Sao phục vụ ${sao_(m)} · Tổng doanh thu ${tr(m.rv.tong.lk)}`, T({ x: 0.8, y: 5.85, w: 11.5, h: 0.35, fontSize: 13, color: C.yel, bold: true }));
    }
    function sao_(m) { return m.sao.py != null ? F.vi(m.sao.py, 2) + '★' : '–'; }

    // ---------------- 2. tổng quan điều hành ----------------
    {
      const s = frame('Tổng quan điều hành', 'Các chỉ số chính và kết luận trong kỳ');
      const rv = m.rv, b1 = m.bnq[0], sao = m.sao, d = m.d319;
      const tw = 3.97, th = 1.55, gx = 0.2;
      const items = [
        ['Chất lượng bên trong', `${m.critOk}/${m.critN} đạt`, `Đúng hẹn ${pct(m.crit[1].month, 2)} · Tay nghề ${pct(m.crit[2].month, 2)}`, m.critN ? (m.critOk === m.critN ? 'ĐẠT' : 'CHƯA ĐẠT') : ''],
        ['1 Đổi 1 – xong trong 3 ngày', pct(b1.ty1), `${b1.n1}/${b1.tong} job · KPI 98% · TB vùng ${pct(b1.vung)}`, b1.dg],
        ['Sao phục vụ', sao_(m), `KPI ${F.vi(sao.kpi, 2)} · tiếp cận ${pct(sao.tot.tl2)}`, sao.dg],
        ['Bảo hành xong (319)', pct(d.rBhx), `${d.bhx}/${d.tot} vận đơn · KPI ${pct(m.cfg.kpi.bhx, 0)}`, d.dg === 'ĐẠT' ? 'ĐẠT' : d.dg ? 'CHƯA ĐẠT' : ''],
        ['Doanh thu bên ngoài', tr(rv.bn.lk), rv.bn.tg ? `Target ${tr(rv.bn.tg)} · dự kiến ${pct(rv.bn.pdk)}` : `1Đ1 ${tr(rv.d11.lk)} · BHMR ${tr(rv.bhmr.lk)} · SCDV ${tr(rv.scn.lk)}`, rv.bn.dg],
        ['Tổng doanh thu', tr(rv.tong.lk), rv.tong.tg ? `Target ${tr(rv.tong.tg)} · dự kiến ${pct(rv.tong.pdk)}` : `Bên trong ${tr(rv.bt.lk)} · dự kiến tháng ${tr(rv.tong.dk)}`, rv.tong.dg]];
      items.forEach((it, i) => tile(s, 0.45 + (i % 3) * (tw + gx), 1.2 + Math.floor(i / 3) * (th + 0.18), tw, th, ...it));
      const y0 = 4.75;
      s.addText('ĐIỂM TỐT', T({ x: 0.45, y: y0, w: 6, h: 0.3, fontSize: 11, bold: true, color: C.good }));
      s.addText(ins.good.slice(0, 4).map(t => ({ text: t, options: { bullet: { code: '25CF' }, breakLine: true } })).concat(ins.good.length ? [] : [{ text: '–' }]), T({ x: 0.45, y: y0 + 0.32, w: 6.1, h: 1.9, fontSize: 11, color: C.ink2, valign: 'top', paraSpaceAfter: 4 }));
      s.addText('CẦN XỬ LÝ', T({ x: 6.85, y: y0, w: 6, h: 0.3, fontSize: 11, bold: true, color: C.bad }));
      s.addText(ins.bad.slice(0, 4).map(t => ({ text: t, options: { bullet: { code: '25CF' }, breakLine: true } })).concat(ins.bad.length ? [] : [{ text: 'Không có chỉ tiêu chưa đạt' }]), T({ x: 6.85, y: y0 + 0.32, w: 6.05, h: 1.9, fontSize: 11, color: C.ink2, valign: 'top', paraSpaceAfter: 4 }));
    }

    // ---------------- 3. chất lượng bên trong ----------------
    {
      const s = frame('Chất lượng bên trong', `Kho CN BHSC CE ${m.cfg.khoTen || ''} (${me.khoBH}) · TLHT = Kết quả ÷ KPI, đạt khi ≥ 100%`);
      const f = (v, c) => v == null ? '–' : c.fmt === 'pct2' ? pct(v, 2) : F.vi(v, 2);
      const rows = [[H('Tiêu chí', { align: 'left' }), H('Cơ sở tính', { align: 'left' }), H('Kết quả'), H('KPI'), H('TLHT'), H('Đánh giá'), H('Tuần 1'), H('Tuần 2'), H('Tuần 3'), H(`Tuần 4`)]];
      for (const c of m.crit) rows.push([Cc(c.lab, { align: 'left', bold: true }), Cc(c.coso, { align: 'left', fontSize: 9.5, color: c.miss ? C.bad : C.ink2 }), Cc(f(c.month, c), { bold: true, fontSize: 12 }), Cc(f(c.kpi, c)), Cc(pct(c.tlht)), dgCell(c.dg),
        ...c.weeks.map((w, i) => Cc(f(w, c), c.wdg[i] === 'CHƯA ĐẠT' ? { color: C.bad, bold: true } : {}))]);
      rows.push([Cc('ĐÁNH GIÁ CHUNG', { align: 'left', bold: true, fill: { color: 'FFF2CC' } }), Cc('', { fill: { color: 'FFF2CC' } }), Cc(`${m.critOk} / ${m.critN} ĐẠT`, { bold: true, fill: { color: 'FFF2CC' }, colspan: 4 }),
        ...[0, 1, 2, 3].map(i => { const v = m.crit.filter(c => c.weeks[i] != null); return Cc(v.length ? `${v.filter(c => c.wdg[i] === 'ĐẠT').length}/${v.length}` : '–', { bold: true, fill: { color: 'FFF2CC' } }); })]);
      tbl(s, rows, { y: 1.3, colW: [2.0, 3.1, 1.05, 0.9, 0.9, 1.0, 0.87, 0.87, 0.87, 0.87], rowH: 0.55 });
      const dh = m.dung.thang;
      s.addText([{ text: 'Lưu ý: ', options: { bold: true } }, { text: `Đúng hẹn là số tạm tính (${dh.tre} đơn chụp hình trễ TMS / ${F.vi(dh.tong)} đơn), chưa trừ đơn đổi giờ khách không xác nhận vì chưa có file KSNB – ${dh.doi} đơn có đổi giờ cần đối chiếu.` }],
        T({ x: 0.45, y: 5.2, w: 12.4, h: 0.6, fontSize: 11, color: C.warn, fill: { color: C.warnBg }, margin: 8 }));
      if (m.gy.has) s.addText(`Góp ý / khiếu nại: đối chiếu ${F.vi(m.gy.tongM)} phiếu tháng ${me.thang} (đến ${F.dm(m.gy.cut)}) – ${m.gy.rows.length ? m.gy.rows.length + ' phiếu của ' + TN : 'không có phiếu nào của ' + TN}.`, T({ x: 0.45, y: 5.95, w: 12.4, h: 0.35, fontSize: 11, color: C.ink2 }));
    }

    // ---------------- 4. bên ngoài + BHSC CE ----------------
    {
      const s = frame('Chất lượng bên ngoài & xử lý đơn bảo hành', 'Jobcard 1 đổi 1 / trọn đời đã hoàn tất · Data 319 – kết quả xử lý vận đơn bảo hành');
      const rows = [[H('Loại jobcard', { align: 'left' }), H('Mục tiêu'), H('Đã HT'), H('Đúng 3N/7N'), H('Tỷ lệ'), H('TG TB (ngày)'), H('TB vùng'), H('Đánh giá')]];
      for (const b of m.bnq) rows.push([Cc(b.lab, { align: 'left', bold: true }), Cc(b.muc), Cc(F.vi(b.tong)), Cc(F.vi(b.n1)), Cc(pct(b.ty1), { bold: true }), Cc(b.tb == null ? '–' : F.vi(b.tb, 2)), Cc(pct(b.vung)), dgCell(b.dg)]);
      rows[0].forEach(c => c.options.fontSize = 8.5); rows.slice(1).forEach(r => r.forEach(c => c.options.fontSize = 9));
      tbl(s, rows, { y: 1.2, w: 6.4, colW: [1.55, 1.05, 0.5, 0.65, 0.6, 0.6, 0.6, 0.85], rowH: 0.42 });
      const d = m.d319;
      tile(s, 0.45, 3.0, 3.1, 1.5, 'BH xong', pct(d.rBhx), `${d.bhx}/${d.tot} vận đơn · KPI ${pct(m.cfg.kpi.bhx, 0)}`, d.dg === 'ĐẠT' ? 'ĐẠT' : d.dg ? 'CHƯA ĐẠT' : '');
      tile(s, 3.75, 3.0, 3.1, 1.5, 'Tỉ lệ chuyển hãng', pct(d.rCh), `${d.ch} vận đơn · đổi mới ${pct(d.rDm)}`, '');
      const weak = d.tho.filter(t => t.tot >= 10).sort((a, b) => a.rBhx - b.rBhx).slice(0, 5);
      const r2 = [[H('Thợ BH xong thấp nhất', { align: 'left' }), H('Vận đơn'), H('BH xong'), H('Cảnh báo môn yếu', { align: 'left' })]];
      for (const t of weak) r2.push([Cc(t.ten, { align: 'left' }), Cc(t.tot), Cc(pct(t.rBhx, 0), { bold: true, color: t.dg === 'ĐẠT' ? C.good : C.bad }), Cc(t.cb || '–', { align: 'left', fontSize: 9 })]);
      tbl(s, r2, { x: 0.45, y: 4.7, w: 6.4, colW: [1.7, 0.75, 0.75, 3.2], rowH: 0.34 });
      const G = d.groups.slice(0, 10);
      if (G.length) s.addChart(pptx.ChartType.bar, [{ name: 'Số vận đơn chuyển hãng', labels: G.map(g => `${g.replace(' (IMEI)', '')} (${Math.round(d.kr[g] * 100)}%)`), values: G.map(g => d.chG[g]) }],
        { x: 7.1, y: 1.2, w: 5.8, h: 5.7, barDir: 'bar', chartColors: [C.s4], catAxisOrientation: 'maxMin', showValue: true, dataLabelFontSize: 9, catAxisLabelFontSize: 9.5, valAxisHidden: true, valGridLine: { style: 'none' },
          showTitle: true, title: `Chuyển hãng theo nhóm hàng (tỉ lệ CH của nhóm)`, titleFontSize: 12, titleColor: C.ink, catAxisLabelFontFace: FONT, dataLabelColor: C.ink });
    }

    // ---------------- 5. sao phục vụ ----------------
    {
